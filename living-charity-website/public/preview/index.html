======================== */\n\n*, *::before, *::after { box-sizing: border-box; }\n* { margin: 0; }\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  scroll-behavior: smooth;\n  scroll-padding-top: 6rem;\n}\n\nbody {\n  font-family: var(--font-text);\n  font-size: var(--text-base);\n  line-height: var(--leading-body);\n  color: var(--text);\n  background: var(--ivory);\n  overflow-x: clip;\n  text-rendering: optimizeLegibility;\n}\n\nimg, picture, svg, video { display: block; max-width: 100%; height: auto; }\n\n/* ---------- Typografie ---------- */\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--ink);\n  font-weight: 700;\n  line-height: var(--leading-tight);\n  letter-spacing: -0.015em;\n  text-wrap: balance;\n  overflow-wrap: break-word;\n}\nh1 { font-size: var(--text-3xl); }\nh2 { font-size: var(--text-2xl); }\nh3 { font-size: var(--text-xl); line-height: var(--leading-snug); }\nh4 { font-size: var(--text-lg); line-height: var(--leading-snug); }\n\np, ul, ol, dl { max-width: var(--container-text); }\np + p { margin-top: 1em; }\np, li, dd, dt, summary { overflow-wrap: break-word; hyphens: auto; }\n\n.lead { font-size: var(--text-lg); line-height: 1.55; color: var(--text); }\nsmall, .text-sm { font-size: var(--text-sm); }\n.text-muted { color: var(--text-muted); }\n\n/* Redaktioneller Akzent (Newsreader, nur kursiv, sparsam) */\n.editorial-accent {\n  font-family: var(--font-editorial);\n  font-style: italic;\n  font-weight: 500;\n  letter-spacing: 0;\n}\n\n/* Eyebrow-Etikett mit kurzer Linie */\n.overline {\n  display: flex;\n  align-items: center;\n  gap: 0.75rem;\n  font-family: var(--font-display);\n  font-size: var(--text-xs);\n  font-weight: 700;\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--forest);\n}\n.overline::before { content: \"\"; width: 1.75rem; height: 2px; background: var(--terracotta); flex: none; }\n.overline--srilanka { color: var(--terracotta-deep); }\n.section-forest .overline { color: var(--on-forest-muted); }\n\na {\n  color: var(--forest);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 0.2em;\n  transition: color var(--duration-quick) var(--ease-out);\n}\na:hover { color: var(--forest-soft); }\n\n::selection { background: var(--sage); color: var(--ink); }\n\n/* ---------- Fokus & Tastatur ---------- */\n\n:focus-visible { outline: var(--focus-ring); outline-offset: 2px; border-radius: 2px; }\n\n.skip-link {\n  position: absolute;\n  left: 1rem; top: -4rem;\n  z-index: 100;\n  padding: 0.75rem 1.25rem;\n  background: var(--ink);\n  color: var(--on-forest);\n  border-radius: var(--radius-sm);\n  text-decoration: none;\n  transition: top var(--duration-quick) var(--ease-out);\n}\n.skip-link:focus-visible { top: 1rem; color: var(--on-forest); }\n\n.visually-hidden {\n  position: absolute !important;\n  width: 1px; height: 1px;\n  margin: -1px; padding: 0; border: 0;\n  clip-path: inset(50%);\n  overflow: hidden;\n  white-space: nowrap;\n}\n\n/* ---------- Layout-Primitive ---------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container-max);\n  margin-inline: auto;\n  padding-inline: var(--container-pad);\n}\n.container--text { max-width: calc(var(--container-text) + 2 * var(--container-pad)); }\n\n.section { padding-block: var(--space-section); }\n.section--sm { padding-block: var(--space-section-sm); }\n.section--sand { background: var(--sand); }\n.section--paper { background: var(--paper); border-block: 1px solid var(--line); }\n\n.section-forest { background: var(--forest); color: var(--on-forest); }\n.section-forest :is(h1, h2, h3, h4) { color: var(--on-forest); }\n.section-forest p { line-height: calc(var(--leading-body) + 0.07); letter-spacing: 0.01em; }\n.section-forest a { color: #cfe0d6; }\n.section-forest a:hover { color: var(--on-forest); }\n.section-forest .text-muted { color: var(--on-forest-muted); }\n\n.section-head { margin-bottom: var(--space-7); max-width: 52rem; }\n.section-head .overline { margin-bottom: var(--space-4); }\n.section-head p { margin-top: var(--space-4); }\n\n.grid { display: grid; gap: var(--space-6); }\n/* Grid-Kinder dürfen unter ihre Min-Content-Breite schrumpfen, damit lange\n   deutsche Komposita (z. B. „Spendenbescheinigung\") umbrechen statt überlaufen */\n.grid > *, .split > *, .hero__grid > *, .impact5__grid > * { min-width: 0; }\n.grid--cards { grid-template-columns: repeat(auto-fit, minmax(min(18rem, 100%), 1fr)); }\n.grid--halves { grid-template-columns: repeat(auto-fit, minmax(min(22rem, 100%), 1fr)); align-items: center; }\n\n.flow > * + * { margin-top: var(--space-4); }\n.flow-lg > * + * { margin-top: var(--space-6); }\n\nhr.rule { border: 0; border-top: 1px solid var(--line); margin-block: var(--space-7); }\n\n/* ---------- Reveal-Animationen (dezent, abschaltbar) ---------- */\n\n.reveal {\n  opacity: 0;\n  transform: translateY(10px);\n  transition:\n    opacity var(--duration-reveal) var(--ease-out),\n    transform var(--duration-reveal) var(--ease-out);\n}\n.reveal.is-visible { opacity: 1; transform: none; }\n.reveal-stagger > * { transition-delay: calc(var(--stagger-i, 0) * 60ms); }\n\n.no-js .reveal { opacity: 1; transform: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  .reveal { opacity: 1; transform: none; transition: none; }\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n/* ---------- Druck ---------- */\n@media print {\n  .site-header, .site-footer, .trust-strip, .skip-link { display: none !important; }\n  body { background: #fff; color: #000; }\n}\n\n/* Muted-Text auf Sand-Flächen braucht einen dunkleren Ton (Kontrast ≥ 4.5:1) */\n.section--sand { --text-muted: #575f5a; }\n\n\n/* ============================================================\n   Komponenten — „Editorial Humanitarian Premium\"\n   Feine Linien, kaum Schatten, Radien 4–12 px, keine Pill-Buttons.\n   Jede Klasse entspricht einem WordPress-Block/Pattern\n   (Zuordnung: docs/wordpress-blueprint.md).\n   ============================================================ */\n\n/* ---------- Buttons (Radius 6 px, Hover max. 2 px Bewegung) ---------- */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 0.5rem;\n  min-height: var(--touch-target);\n  padding: 0.6rem 1.4rem;\n  border: 1.5px solid transparent;\n  border-radius: var(--radius-sm);\n  font-family: var(--font-display);\n  font-size: 1rem;\n  font-weight: 700;\n  letter-spacing: 0.005em;\n  text-decoration: none;\n  cursor: pointer;\n  transition:\n    background-color var(--duration-quick) var(--ease-out),\n    border-color var(--duration-quick) var(--ease-out),\n    color var(--duration-quick) var(--ease-out),\n    transform var(--duration-quick) var(--ease-out);\n}\n.btn:hover { transform: translateY(-1px); }\n.btn:active { transform: translateY(1px); }\n\n.btn--primary { background: var(--forest); color: var(--on-forest); }\n.btn--primary:hover { background: var(--forest-soft); color: var(--on-forest); }\n\n.btn--accent { background: var(--terracotta-deep); color: #fff; }\n.btn--accent:hover { background: var(--terracotta); color: #fff; }\n\n.btn--ghost { border-color: var(--line-strong); color: var(--ink); background: transparent; }\n.btn--ghost:hover { border-color: var(--forest); color: var(--forest); background: var(--paper); }\n\n.section-forest .btn--ghost { border-color: var(--on-forest-line); color: var(--on-forest); }\n.section-forest .btn--ghost:hover { border-color: var(--on-forest); background: rgb(242 244 239 / 0.07); color: var(--on-forest); }\n.section-forest .btn--primary { background: var(--on-forest); color: var(--forest); }\n.section-forest .btn--primary:hover { background: #fff; color: var(--forest); }\n\n.btn .btn__arrow { transition: transform var(--duration-quick) var(--ease-out); }\n.btn:hover .btn__arrow { transform: translateX(2px); }\n\n/* Textlink mit Pfeilbewegung */\n.arrow-link {\n  display: inline-flex;\n  align-items: center;\n  gap: 0.4rem;\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-decoration: none;\n}\n.arrow-link span[aria-hidden] { transition: transform var(--duration-quick) var(--ease-out); }\n.arrow-link:hover span[aria-hidden] { transform: translateX(2px); }\n\n/* ---------- Trust-Strip (über dem Header) ---------- */\n\n.trust-strip {\n  background: var(--ink);\n  color: var(--on-forest-muted);\n  font-size: var(--text-xs);\n  letter-spacing: 0.06em;\n  text-align: center;\n  padding: 0.45rem var(--container-pad);\n}\n.trust-strip strong { color: var(--on-forest); font-weight: 600; }\n\n/* ---------- Header (Forest, sticky nach erstem Scrollbereich) ---------- */\n\n.site-header {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  background: var(--forest);\n  color: var(--on-forest);\n  transition: box-shadow var(--duration-quick) var(--ease-out);\n}\n.site-header.is-scrolled { box-shadow: 0 2px 12px rgb(23 32 29 / 0.25); }\n\n.site-header__bar {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--space-5);\n  min-height: 4.25rem;\n}\n\n.brand { display: inline-flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--on-forest); }\n.brand:hover { color: #fff; }\n.brand__mark { width: 2.1rem; height: 2.1rem; flex: none; }\n.brand__name { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; line-height: 1.1; letter-spacing: -0.01em; }\n.brand__sub {\n  display: block;\n  font-size: 0.66rem;\n  font-weight: 600;\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--on-forest-muted);\n}\n\n.site-nav__list { display: flex; align-items: center; gap: clamp(0.1rem, 0.8vw, 0.75rem); list-style: none; padding: 0; margin: 0; }\n.site-nav__link {\n  display: inline-flex;\n  align-items: center;\n  min-height: var(--touch-target);\n  padding: 0.4rem 0.7rem;\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: 0.95rem;\n  color: var(--on-forest);\n  text-decoration: none;\n  border-radius: var(--radius-xs);\n}\n.site-nav__link:hover { color: #fff; background: rgb(242 244 239 / 0.08); }\n.site-nav__link[aria-current=\"page\"] { color: #fff; box-shadow: inset 0 -2px 0 var(--terracotta); }\n\n.site-nav__cta { margin-left: 0.5rem; background: var(--terracotta-deep); color: #fff; }\n.site-nav__cta:hover { background: var(--terracotta); color: #fff; }\n\n.nav-toggle {\n  display: none;\n  flex-direction: column;\n  justify-content: center;\n  gap: 5px;\n  width: var(--touch-target);\n  height: var(--touch-target);\n  padding: 0.6rem;\n  border: 1.5px solid var(--on-forest-line);\n  border-radius: var(--radius-sm);\n  background: transparent;\n  cursor: pointer;\n}\n.nav-toggle__line { display: block; height: 2px; background: var(--on-forest); border-radius: 1px; transition: transform var(--duration-quick) var(--ease-out), opacity var(--duration-quick) var(--ease-out); }\n\n@media (max-width: 62rem) {\n  .nav-toggle { display: flex; }\n  .site-nav {\n    position: absolute;\n    inset: 100% 0 auto 0;\n    background: var(--forest);\n    border-top: 1px solid var(--on-forest-line);\n    box-shadow: 0 12px 24px rgb(23 32 29 / 0.3);\n    padding: var(--space-4) var(--container-pad) var(--space-6);\n    display: none;\n  }\n  .site-nav.is-open { display: block; }\n  .site-nav__list { flex-direction: column; align-items: stretch; gap: 0; }\n  .site-nav__link { width: 100%; padding: 0.85rem 0.75rem; font-size: 1.05rem; }\n  .site-nav__cta { margin: var(--space-4) 0 0; width: 100%; }\n  .nav-toggle[aria-expanded=\"true\"] .nav-toggle__line:nth-child(1) { transform: translateY(7px) rotate(45deg); }\n  .nav-toggle[aria-expanded=\"true\"] .nav-toggle__line:nth-child(2) { opacity: 0; }\n  .nav-toggle[aria-expanded=\"true\"] .nav-toggle__line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }\n}\n\n/* ---------- Editorial Hero ---------- */\n\n.hero { padding-block: clamp(3rem, 2rem + 3.5vw, 5.5rem) var(--space-section); }\n.hero__grid { display: grid; gap: clamp(2rem, 4vw, 4.5rem); align-items: center; }\n@media (min-width: 60rem) { .hero__grid { grid-template-columns: 6.5fr 5.5fr; } }\n.hero h1 { margin-block: var(--space-4) var(--space-5); max-width: 17ch; }\n.hero__sub { font-size: var(--text-lg); line-height: 1.55; max-width: 48ch; }\n.hero__actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-6); }\n.hero__trust { margin-top: var(--space-5); font-size: var(--text-sm); color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem; }\n.hero__trust::before { content: \"\"; width: 1.25rem; height: 1px; background: var(--line-strong); }\n\n/* Dokumentarische Bildfläche mit Bildzeile */\n.doc-media { position: relative; }\n.doc-media__frame {\n  border-radius: var(--radius-md);\n  overflow: hidden;\n  background: var(--sand);\n  border: 1px solid var(--line);\n  aspect-ratio: 4 / 5;\n}\n.doc-media__frame--wide { aspect-ratio: 3 / 2; }\n.doc-media__frame img, .doc-media__frame svg { width: 100%; height: 100%; object-fit: cover; }\n.doc-media__caption {\n  display: flex;\n  justify-content: space-between;\n  gap: var(--space-4);\n  padding-top: 0.5rem;\n  font-size: var(--text-xs);\n  color: var(--text-muted);\n  max-width: none;\n}\n\n/* neutraler Platzhalter, ehrlich beschriftet — nie als Projektfoto tarnen */\n.media-pending {\n  width: 100%; height: 100%;\n  display: grid;\n  place-items: center;\n  background:\n    linear-gradient(160deg, var(--sand) 0%, #efe9dc 55%, var(--sage) 140%);\n  color: var(--text-muted);\n  font-size: var(--text-sm);\n  text-align: center;\n  padding: var(--space-5);\n}\n\n/* ---------- 5-Euro-Impact (redaktionell, keine aggressive Spendenbox) ---------- */\n\n.impact5 { border-block: 1px solid var(--line); background: var(--paper); }\n.impact5__grid { display: grid; gap: clamp(1.5rem, 4vw, 4rem); align-items: center; padding-block: clamp(2.5rem, 4vw, 4.5rem); }\n@media (min-width: 56rem) { .impact5__grid { grid-template-columns: auto 1fr; } }\n.impact5__figure {\n  font-family: var(--font-editorial);\n  font-style: italic;\n  font-weight: 500;\n  font-size: var(--text-impact);\n  line-height: 0.95;\n  color: var(--terracotta-deep);\n  white-space: nowrap;\n}\n.impact5__figure small { display: block; font-family: var(--font-display); font-style: normal; font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); margin-top: 0.5rem; white-space: normal; }\n.impact5 h2 { max-width: 24ch; }\n.impact5__body p { margin-top: var(--space-4); }\n.impact5__note { font-size: var(--text-sm); color: var(--text-muted); }\n\n/* Quellen-Kennzeichnung */\n.source-line {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 0.5rem 1rem;\n  margin-top: var(--space-4);\n  font-size: var(--text-sm);\n  max-width: none;\n}\n.source-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 0.35rem;\n  padding: 0.1rem 0.6rem;\n  border: 1px solid var(--line-strong);\n  border-radius: var(--radius-xs);\n  font-family: var(--font-display);\n  font-size: var(--text-xs);\n  font-weight: 700;\n  letter-spacing: 0.04em;\n  color: var(--text-muted);\n  background: var(--ivory);\n}\n.source-badge--original { color: var(--success); border-color: var(--success); }\n.source-badge--extern { color: var(--forest); }\n.source-badge--illustration { color: var(--warning); border-color: var(--warning); }\na.external-link::after { content: \" ↗\"; font-size: 0.85em; }\n\n/* ---------- Karten (editorial, feine Linien) ---------- */\n\n.card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  background: var(--paper);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-md);\n  overflow: hidden;\n  transition: border-color var(--duration-quick) var(--ease-out), transform var(--duration-quick) var(--ease-out), box-shadow var(--duration-quick) var(--ease-out);\n}\n.card:hover, .card:focus-within { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow-lift); }\n.card__media { aspect-ratio: 3 / 2; background: var(--sand); border-bottom: 1px solid var(--line); }\n.card__media img, .card__media svg { width: 100%; height: 100%; object-fit: cover; }\n.card__body { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); flex: 1; }\n.card__meta { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; font-size: var(--text-xs); color: var(--text-muted); max-width: none; }\n.card__title { font-size: var(--text-lg); }\n.card__title a { color: var(--ink); text-decoration: none; }\n.card__title a:hover { color: var(--forest); }\n.card__title a::after { content: \"\"; position: absolute; inset: 0; }\n.card__excerpt { font-size: var(--text-sm); flex: 1; }\n.card__link { font-family: var(--font-display); font-weight: 700; font-size: var(--text-sm); color: var(--forest); }\n\n.badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 0.35em;\n  padding: 0.12em 0.6em;\n  border-radius: var(--radius-xs);\n  border: 1px solid transparent;\n  font-family: var(--font-display);\n  font-size: var(--text-xs);\n  font-weight: 700;\n  letter-spacing: 0.03em;\n  background: var(--sand);\n  color: var(--ink);\n}\n.badge::before { content: \"\"; width: 0.45em; height: 0.45em; border-radius: 50%; background: currentColor; }\n.badge--aktiv { background: #e2efe7; color: var(--success); }\n.badge--geplant { background: var(--sand); color: #6d6046; }\n.badge--laufend { background: #e3ebe6; color: var(--forest); }\n.badge--abgeschlossen { background: #e6e6ec; color: #4c4c66; }\n.badge--pausiert { background: #f0e5d6; color: #815318; }\n.badge--pruefung { background: #f6ede8; color: var(--terracotta-deep); }\n\n/* ---------- Schritt-Liste ---------- */\n\n.steps { list-style: none; counter-reset: step; padding: 0; display: grid; gap: var(--space-5); max-width: 40rem; }\n.steps li { counter-increment: step; position: relative; padding-left: 3.5rem; }\n.steps li::before {\n  content: counter(step);\n  position: absolute;\n  left: 0; top: -0.15rem;\n  width: 2.4rem; height: 2.4rem;\n  display: grid;\n  place-items: center;\n  border-radius: 50%;\n  border: 1.5px solid var(--line-strong);\n  background: var(--paper);\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 1.05rem;\n  color: var(--forest);\n}\n.steps li + li::after { content: \"\"; position: absolute; left: 1.2rem; top: -1.35rem; height: 1.1rem; width: 1.5px; background: var(--line-strong); }\n.steps h3 { font-size: var(--text-lg); margin-bottom: 0.2em; }\n.steps p { font-size: var(--text-sm); color: var(--text-muted); }\n\n.section-forest .steps li::before { background: transparent; border-color: var(--on-forest-line); color: var(--on-forest); }\n.section-forest .steps li + li::after { background: var(--on-forest-line); }\n.section-forest .steps p { color: var(--on-forest-muted); }\n\n/* ---------- Text-Bild-Split ---------- */\n\n.split { display: grid; gap: clamp(2rem, 4vw, 4.5rem); align-items: center; }\n@media (min-width: 60rem) {\n  .split { grid-template-columns: 1fr 1fr; }\n  .split--media-left .split__media { order: -1; }\n  .split--asym { grid-template-columns: 7fr 5fr; }\n}\n\n/* ---------- Baum-Auswahl (Plant Ceylon) ---------- */\n\n.tree-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(9.5rem, 100%), 1fr)); gap: var(--space-3); max-width: none; }\n.tree-item {\n  display: flex;\n  flex-direction: column;\n  gap: 0.35rem;\n  padding: var(--space-4);\n  background: var(--paper);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-sm);\n  font-size: var(--text-sm);\n}\n.tree-item strong { font-family: var(--font-display); color: var(--ink); }\n.tree-item span { color: var(--text-muted); font-size: var(--text-xs); }\n\n/* ---------- Proof-Modul ---------- */\n\n.proof-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr)); gap: var(--space-5); max-width: none; }\n.proof-item { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper); padding: var(--space-5); }\n.proof-item h3 { font-size: var(--text-base); margin-bottom: 0.35rem; }\n.proof-item p { font-size: var(--text-sm); color: var(--text-muted); }\n.proof-item .source-badge { margin-bottom: var(--space-3); }\n\n/* ---------- Team ---------- */\n\n.team-card {\n  background: var(--paper);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-md);\n  padding: var(--space-5);\n  display: flex;\n  gap: var(--space-4);\n  align-items: center;\n}\n.team-card__portrait {\n  width: 4.25rem; height: 4.25rem;\n  flex: none;\n  border-radius: 50%;\n  overflow: hidden;\n  background: var(--sand);\n  border: 1px solid var(--line);\n  display: grid;\n  place-items: center;\n  color: var(--forest);\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 1.2rem;\n}\n.team-card__name { font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: var(--text-lg); }\n.team-card__role { font-size: var(--text-sm); color: var(--text-muted); }\n\n/* ---------- Donation Panel ---------- */\n\n.donation-panel {\n  background: var(--paper);\n  border: 1px solid var(--line-strong);\n  border-radius: var(--radius-md);\n  padding: clamp(1.5rem, 3vw, 2.25rem);\n  max-width: 38rem;\n}\n.donation-panel__label { font-family: var(--font-display); font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--forest); }\n.donation-panel dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.45rem 1.25rem; margin-block: var(--space-4); font-size: 1rem; }\n.donation-panel dt { color: var(--text-muted); }\n.donation-panel dd { margin: 0; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }\n.donation-panel .iban { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }\n.donation-panel__actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }\n\n/* Betragsauswahl (informativ für Überweisung, keine Zahlungsabwicklung) */\n.amount-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-block: var(--space-4); }\n.amount-picker button {\n  min-height: var(--touch-target);\n  min-width: 4rem;\n  padding: 0.4rem 0.9rem;\n  border: 1.5px solid var(--line-strong);\n  border-radius: var(--radius-sm);\n  background: var(--ivory);\n  font: inherit;\n  font-family: var(--font-display);\n  font-weight: 700;\n  color: var(--ink);\n  cursor: pointer;\n  transition: border-color var(--duration-quick) var(--ease-out), background var(--duration-quick) var(--ease-out);\n}\n.amount-picker button[aria-pressed=\"true\"] { border-color: var(--forest); background: #e3ebe6; color: var(--forest); }\n.amount-picker button:hover { border-color: var(--forest); }\n\n.copy-btn { position: relative; }\n.copy-btn__feedback {\n  position: absolute;\n  inset: auto auto calc(100% + 0.5rem) 50%;\n  transform: translateX(-50%);\n  padding: 0.3rem 0.7rem;\n  background: var(--ink);\n  color: var(--on-forest);\n  border-radius: var(--radius-xs);\n  font-size: var(--text-xs);\n  white-space: nowrap;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity var(--duration-quick) var(--ease-out);\n}\n.copy-btn.is-copied .copy-btn__feedback { opacity: 1; }\n\n/* QR-Vorbereitung (Girocode) — Fläche reserviert, erst mit bestätigten Daten aktiv */\n.qr-slot {\n  display: grid;\n  place-items: center;\n  gap: 0.5rem;\n  aspect-ratio: 1;\n  max-width: 11rem;\n  border: 1.5px dashed var(--line-strong);\n  border-radius: var(--radius-sm);\n  padding: var(--space-4);\n  color: var(--text-muted);\n  font-size: var(--text-xs);\n  text-align: center;\n}\n\n/* ---------- Formulare ---------- */\n\n.form { display: grid; gap: var(--space-5); max-width: 38rem; }\n.form__row { display: grid; gap: var(--space-5); }\n@media (min-width: 40rem) { .form__row--halves { grid-template-columns: 1fr 1fr; } }\n\n.field { display: grid; gap: 0.4rem; }\n.field label { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; color: var(--ink); }\n.field .field__hint { font-size: var(--text-xs); color: var(--text-muted); }\n.field__optional { font-weight: 400; color: var(--text-muted); }\n\n.field input, .field select, .field textarea {\n  width: 100%;\n  min-height: var(--touch-target);\n  padding: 0.6rem 0.9rem;\n  border: 1.5px solid var(--line-strong);\n  border-radius: var(--radius-sm);\n  background: var(--paper);\n  font: inherit;\n  color: var(--ink);\n  transition: border-color var(--duration-quick) var(--ease-out), box-shadow var(--duration-quick) var(--ease-out);\n}\n.field textarea { min-height: 9rem; resize: vertical; }\n.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--forest-soft); }\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {\n  outline: none;\n  border-color: var(--forest);\n  box-shadow: 0 0 0 3px var(--sage);\n}\n.field.has-error input, .field.has-error textarea, .field.has-error select { border-color: var(--error); }\n.field__error { display: none; font-size: var(--text-sm); font-weight: 600; color: var(--error); }\n.field.has-error .field__error { display: block; }\n\n.checkbox-field { display: flex; gap: 0.75rem; align-items: flex-start; max-width: var(--container-text); }\n.checkbox-field input { width: 1.35rem; height: 1.35rem; margin-top: 0.2rem; flex: none; accent-color: var(--forest); }\n.checkbox-field label { font-size: var(--text-sm); font-weight: 400; }\n.checkbox-field.has-error label { color: var(--error); }\n\n.form__status { display: none; padding: var(--space-4); border-radius: var(--radius-sm); font-weight: 600; max-width: none; }\n.form__status.is-success { display: block; background: #e2efe7; color: var(--success); }\n.form__status.is-error { display: block; background: #f7e7e5; color: var(--error); }\n\n.form .hp-field { position: absolute !important; left: -9999px; width: 1px; height: 1px; overflow: hidden; }\n\n/* ---------- FAQ ---------- */\n\n.faq { border-top: 1px solid var(--line); max-width: var(--container-text); }\n.faq details { border-bottom: 1px solid var(--line); }\n.faq summary {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: var(--space-4);\n  padding: var(--space-4) 0;\n  min-height: var(--touch-target);\n  font-family: var(--font-display);\n  font-weight: 700;\n  color: var(--ink);\n  cursor: pointer;\n  list-style: none;\n}\n.faq summary::-webkit-details-marker { display: none; }\n.faq summary::after { content: \"+\"; font-size: 1.35rem; color: var(--forest); transition: transform var(--duration-quick) var(--ease-out); flex: none; }\n.faq details[open] summary::after { transform: rotate(45deg); }\n.faq .faq__body { padding: 0 0 var(--space-5); }\n\n/* ---------- CTA-Sektion ---------- */\n\n.cta-final .container { display: grid; gap: var(--space-6); align-items: center; }\n@media (min-width: 56rem) { .cta-final .container { grid-template-columns: 1.4fr 1fr; } }\n.cta-final__actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }\n\n/* ---------- Footer (Forest) ---------- */\n\n.site-footer { background: var(--forest); color: var(--on-forest-muted); font-size: var(--text-sm); }\n.site-footer a { color: #cfe0d6; }\n.site-footer a:hover { color: #fff; }\n.site-footer__grid { display: grid; gap: var(--space-7); padding-block: var(--space-8) var(--space-6); }\n@media (min-width: 56rem) { .site-footer__grid { grid-template-columns: 2fr 1fr 1fr 1fr; } }\n.site-footer h2 {\n  font-family: var(--font-display);\n  font-size: var(--text-xs);\n  font-weight: 700;\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--on-forest-muted);\n  margin-bottom: var(--space-4);\n}\n.site-footer ul { list-style: none; padding: 0; display: grid; gap: 0.5rem; }\n.site-footer address { font-style: normal; line-height: 1.7; }\n.site-footer__brand .brand__name { color: #fff; }\n.site-footer__register { margin-top: var(--space-4); color: var(--on-forest-muted); }\n.site-footer__bottom {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--space-4);\n  justify-content: space-between;\n  padding-block: var(--space-5);\n  border-top: 1px solid var(--on-forest-line);\n  color: var(--on-forest-muted);\n}\n\n/* ---------- Breadcrumbs ---------- */\n\n.breadcrumbs { padding-top: var(--space-5); font-size: var(--text-sm); color: var(--text-muted); }\n.breadcrumbs ol { list-style: none; display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0; max-width: none; }\n.breadcrumbs li + li::before { content: \"›\"; margin-right: 0.35rem; color: var(--line-strong); }\n.breadcrumbs a { color: var(--text-muted); }\n.breadcrumbs [aria-current=\"page\"] { color: var(--ink); font-weight: 600; }\n\n/* ---------- Seitenkopf ---------- */\n\n.page-head { padding-block: var(--space-6) 0; }\n.page-head h1 { margin-block: var(--space-3) var(--space-4); max-width: 22ch; }\n.page-head .lead { max-width: 56ch; }\n\n/* ---------- Leerzustand / Fehlerzustand / Ladezustand ---------- */\n\n.empty-state {\n  border: 1px solid var(--line);\n  border-radius: var(--radius-md);\n  background: var(--paper);\n  padding: clamp(2rem, 4vw, 3.5rem);\n  max-width: 44rem;\n}\n.empty-state :is(h2, h3) { font-size: var(--text-xl); margin-bottom: var(--space-3); }\n.empty-state p { color: var(--text-muted); }\n.empty-state .btn { margin-top: var(--space-5); }\n\n.error-state { border-left: 3px solid var(--error); background: #f7e7e5; color: var(--error); padding: var(--space-4) var(--space-5); border-radius: var(--radius-xs); font-weight: 600; max-width: var(--container-text); }\n.loading-state { color: var(--text-muted); font-size: var(--text-sm); display: inline-flex; align-items: center; gap: 0.5rem; }\n.loading-state::before { content: \"\"; width: 1em; height: 1em; border: 2px solid var(--line-strong); border-top-color: var(--forest); border-radius: 50%; animation: lc-spin 0.9s linear infinite; }\n@keyframes lc-spin { to { transform: rotate(360deg); } }\n\n/* ---------- Infokarte / Zwei-Klick-Karte ---------- */\n\n.info-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-5); }\n.info-card :is(h2, h3) { font-size: var(--text-lg); margin-bottom: var(--space-3); }\n.info-card address { font-style: normal; line-height: 1.7; }\n\n.map-consent {\n  aspect-ratio: 16 / 9;\n  display: grid;\n  place-items: center;\n  text-align: center;\n  padding: var(--space-5);\n  background: var(--sand);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-md);\n}\n.map-consent p { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-4); }\n\n/* ---------- Projekt-Detail ---------- */\n\n.project-facts {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(min(11rem, 100%), 1fr));\n  gap: 1px;\n  background: var(--line);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-md);\n  overflow: hidden;\n  max-width: none;\n}\n.project-facts > div { background: var(--paper); padding: var(--space-4); }\n.project-facts dt { font-family: var(--font-display); font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }\n.project-facts dd { margin: 0.25rem 0 0; font-weight: 600; color: var(--ink); }\n\n.progress { --progress: 0%; height: 0.5rem; border-radius: var(--radius-xs); background: var(--sand); border: 1px solid var(--line); overflow: hidden; }\n.progress__bar { width: var(--progress); height: 100%; background: var(--forest); transition: width 900ms var(--ease-out); }\n\n/* ---------- Update-Karte / Dokumente ---------- */\n\n.update-card { border-left: 2px solid var(--line-strong); padding-left: var(--space-4); }\n.update-card time { font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-display); font-weight: 700; letter-spacing: 0.04em; }\n\n.doc-list { list-style: none; padding: 0; display: grid; gap: var(--space-2); max-width: var(--container-text); }\n.doc-list a {\n  display: flex;\n  justify-content: space-between;\n  gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-sm);\n  background: var(--paper);\n  text-decoration: none;\n  font-weight: 600;\n}\n.doc-list a:hover { border-color: var(--forest); }\n\n/* ---------- 404 / Suche / Danke ---------- */\n.error-page { min-height: 55vh; display: grid; align-items: center; }\n.search-form { display: flex; gap: var(--space-2); max-width: 34rem; }\n.search-form input { flex: 1; }\n.search-results { list-style: none; padding: 0; display: grid; gap: var(--space-3); max-width: var(--container-text); }\n.search-results a { font-family: var(--font-display); font-weight: 700; }\n</style></head><body>\n<a class=\"skip-link\" href=\"#hauptinhalt\">Zum Inhalt springen</a>\n<div id=\"app\"></div>\n<script>\nvar PAGES = {\"/404.html\":{\"body\":\"\\n<a class=\\\"skip-link\\\" href=\\\"#hauptinhalt\\\">Zum Inhalt springen</a>\\n<div class=\\\"trust-strip\\\">\\n  <strong>Eingetragener Verein seit 2010</strong> · Amtsgericht Köln · VR 16395\\n</div>\\n<header class=\\\"site-header\\\" data-header>\\n  <div class=\\\"container site-header__bar\\\">\\n    <a class=\\\"brand\\\" href=\\\"/\\\" aria-label=\\\"Living Charity e. V. — zur Startseite\\\">\\n      <svg class=\\\"brand__mark\\\" viewBox=\\\"0 0 40 40\\\" aria-hidden=\\\"true\\\" focusable=\\\"false\\\">\\n        <!-- Neutrale typografische Bildmarke (Platzhalter bis das echte\\n             Vereinslogo vorliegt — interner Status: confirmation-required) -->\\n        <rect width=\\\"40\\\" height=\\\"40\\\" rx= e</a></li><li><a href=\\\"/ueber-uns/\\\">Über uns</a></li><li><a href=\\\"/transparenz/\\\">Transparenz</a></li></ul></nav>\\n<nav aria-label=\\\"Helfen\\\"><h2>Helfen</h2><ul><li><a href=\\\"/spenden/\\\">Spenden</a></li><li><a href=\\\"/plant-ceylon/\\\">Plant Ceylon</a></li><li><a href=\\\"/aktuelles/\\\">Aktuelles</a></li><li><a href=\\\"/kontakt/\\\">Kontakt</a></li></ul></nav>\\n<nav aria-label=\\\"Rechtliches\\\"><h2>Rechtliches</h2><ul><li><a href=\\\"/impressum/\\\">Impressum</a></li><li><a href=\\\"/datenschutz/\\\">Datenschutz</a></li></ul></nav>\\n    </div>\\n    <div class=\\\"site-footer__bottom\\\">\\n      <p>© <span data-current-year>2026</span> Living Charity e. V.</p>\\n      <p>Hilfe, die Menschen direkt erreicht.</p>\\n    </div>\\n  </div>\\n</footer>\\n\\n\\n\",\"title\":\"Impressum — Living Charity e. V.\"},\"/\":{\"body\":\"\\n<a class=\\\"skip-link\\\" href=\\\"#hauptinhalt\\\">Zum Inhalt springen</a>\\n<div class=\\\"trust-strip\\\">\\n  <strong>Eingetragener Verein seit 2010</strong> · Amtsgericht Köln · VR 16395\\n</div>\\n<header class=\\\"site-header\\\" data-header>\\n  <div class=\\\"container site-header__bar\\\">\\n    <a class=\\\"brand\\\" href=\\\"/\\\" aria-label=\\\"Living Charity e. V. — zur Startseite\\\">\\n      <svg class=\\\"brand__mark\\\" viewBox=\\\"0 0 40 40\\\" aria-hidden=\\\"true\\\" focusable=\\\"false\\\">\\n        <!-- Neutrale typografische Bildmarke (Platzhalter bis das echte\\n             Vereinslogo vorliegt — interner Status: confirmation-required) -->\\n        <rect width=\\\"40\\\" height=\\\"40\\\" rx=\\\"8\\\" fill=\\\"#f2f4ef\\\"/>\\n        <text x=\\\"20\\\" y=\\\"27\\\" text-anchor=\\\"middle\\\" font-family=\\\"Manrope, sans-serif\\\" font-size=\\\"17\\\" font-weight=\\\"800\\\" fill=\\\"#173f35\\\">LC</text>\\n        <rect x=\\\"8\\\" y=\\\"31\\\" width=\\\"24\\\" height=\\\"2.5\\\" rx=\\\"1.25\\\" fill=\\\"#b86548\\\"/>\\n      </svg>\\n      <span class=\\\"brand__name\\\">Living Charity\\n        <span class=\\\"brand__sub\\\">Eingetragener Verein · Bergneustadt</span>\\n      </span>\\n    </a>\\n    <button class=\\\"nav-toggle\\\" type=\\\"button\\\" aria-expanded=\\\"false\\\" aria-controls=\\\"hauptnavigation\\\" data-nav-toggle>\\n      <span class=\\\"visually-hidden\\\">Menü öffnen oder schließen</span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n    </button>\\n    <nav class=\\\"site-nav\\\" id=\\\"hauptnavigation\\\" aria-label=\\\"Hauptnavigation\\\" data-nav>\\n      <ul class=\\\"site-nav__list\\\">\\n        <li><a class=\\\"site-nav__link\\\" href=\\\"/unsere-arbeit/\\\">Unsere Arbeit</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/sri-lanka/\\\">Sri Lanka</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/projekte/\\\">Projekte</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/ueber-uns/\\\">Über uns</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/aktuelles/\\\">Aktuelles</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/kontakt/\\\">Kontakt</a></li>\\n        <li><a class=\\\"btn site-nav__cta\\\" href=\\\"/spenden/\\\">Jetzt helfen</a></li>\\n      </ul>\\n    </nav>\\n  </div>\\n</header>\\n\\n<main id=\\\"hauptinhalt\\\">\\n<!-- ============ 3. Hero ============ -->\\n<section class=\\\"hero\\\">\\n  <div class=\\\"container hero__grid\\\">\\n    <div>\\n      <p class=\\\"overline\\\">Living Charity e.&nbsp;V. · Hilfe für Menschen in Not</p>\\n      <h1>Hilfe, die Menschen direkt erreicht.</h1>\\n      <p class=\\\"hero__sub\\\">Living Charity e.&nbsp;V. unterstützt Menschen in akuten\\n      Notlagen und verbindet Spenderinnen und Spender in Deutschland mit\\n      konkreter Hilfe in Sri Lanka.</p>\\n      <div class=\\\"hero__actions\\\">\\n        <a class=\\\"btn btn--accent\\\" href=\\\"/spenden/\\\">Für Sri Lanka spenden <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n        <a class=\\\"btn btn--ghost\\\" href=\\\"/unsere-arbeit/\\\">Unsere Arbeit kennenlernen</a>\\n      </div>\\n      <p class=\\\"hero__trust\\\">Eingetragener Verein seit 2010</p>\\n    </div>\\n    <figure class=\\\"doc-media reveal\\\">\\n      <div class=\\\"doc-media__frame\\\">\\n        <div class=\\\"media-pending\\\">Originale Projektaufnahme wird ergänzt.</div>\\n      </div>\\n      <figcaption class=\\\"doc-media__caption\\\">\\n        <span>Dokumentarische Fotografie aus Sri Lanka — in Vorbereitung</span>\\n        <span class=\\\"source-badge source-badge--illustration\\\">Platzhalter</span>\\n      </figcaption>\\n    </figure>\\n  </div>\\n</section>\\n\\n<!-- ============ 4. 5-Euro-Impact ============ -->\\n<section class=\\\"impact5\\\" aria-label=\\\"Was ein kleiner Beitrag bewirken kann\\\">\\n      <div class=\\\"container impact5__grid\\\">\\n        <p class=\\\"impact5__figure reveal\\\">5 €<small>Ein Tag Nahrung — laut Spendenaufruf</small></p>\\n        <div class=\\\"impact5__body reveal\\\">\\n          <h2>Schon ein kleiner Beitrag kann einen Tag Hilfe bedeuten.</h2>\\n          <p>Nach Angaben des öffentlichen Spendenaufrufs von Dr. Umes Arunagirinathan kann bereits ein Beitrag von 5 Euro dabei helfen, eine Familie in Sri Lanka einen Tag lang mit Nahrung zu versorgen.</p>\\n          <p class=\\\"impact5__note\\\">Die tatsächliche Verwendung richtet sich nach dem aktuellen Bedarf und der jeweiligen Hilfsaktion.</p>\\n          <p class=\\\"source-line\\\">\\n            <span class=\\\"source-badge source-badge--extern\\\">Externe Quelle</span>\\n            <a class=\\\"external-link\\\" href=\\\"https://de.linkedin.com/posts/dr-umes-arunagirinathan-991b21125_spendenaufruf-f%C3%BCr-die-flutopfer-in-sri-lanka-activity-7400661832572772353-tqWa\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Quelle und Spendenaufruf ansehen</a>\\n          </p>\\n        </div>\\n      </div>\\n    </section>\\n\\n<!-- ============ 5. Vorstellung Living Charity ============ -->\\n<section class=\\\"section\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"split split--asym\\\">\\n      <div class=\\\"flow reveal\\\">\\n        <p class=\\\"overline\\\">Seit 2010 engagiert</p>\\n        <h2>Solidarität wird wirksam, wenn aus Unterstützung konkrete Hilfe entsteht.</h2>\\n        <p>Living Charity e. V. ist ein seit 2010 eingetragener Verein mit Sitz in Bergneustadt. Der Verein sammelt Spenden und organisiert Unterstützung für Menschen in akuten Notlagen. Ein besonderer Schwerpunkt liegt auf Hilfsaktionen für Menschen in Sri Lanka.</p>\\n        <p>Unser Ziel ist es, Hilfsbedarf sichtbar zu machen, Unterstützer miteinander zu verbinden und verfügbare Mittel verantwortungsvoll für konkrete Maßnahmen einzusetzen.</p>\\n      </div>\\n      <div class=\\\"info-card reveal\\\">\\n        <h3>Auf einen Blick</h3>\\n        <ul style=\\\"padding-left:1.1rem; display:grid; gap:.6rem\\\">\\n          <li>Eingetragener Verein seit dem 16. Juni 2010</li>\\n          <li>Amtsgericht Köln · VR 16395</li>\\n          <li>Sitz in Bergneustadt</li>\\n          <li>Direkt erreichbar: <a href=\\\"mailto:info@livingcharity.de\\\">info@livingcharity.de</a></li>\\n        </ul>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<!-- ============ 6. Sri-Lanka-Bereich ============ -->\\n<section class=\\\"section section-forest\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Schwerpunkt</p>\\n      <h2>Unterstützung für Menschen in Sri Lanka</h2>\\n      <p>Überschwemmungen und andere akute Notlagen können Familien innerhalb\\n      kurzer Zeit die Grundlage ihres Alltags nehmen. Living Charity sammelt\\n      Unterstützung für Lebensmittel und notwendige Versorgung.</p>\\n    </div>\\n    <div class=\\\"grid grid--cards reveal-stagger\\\">\\n      <div class=\\\"reveal\\\">\\n        <h3 style=\\\"margin-bottom:.4rem\\\">Lebensmittelhilfe</h3>\\n        <p class=\\\"text-muted\\\">Grundversorgung für Familien, die durch eine akute\\n        Notlage ihre Lebensgrundlage verloren haben.</p>\\n      </div>\\n      <div class=\\\"reveal\\\">\\n        <h3 style=\\\"margin-bottom:.4rem\\\">Unterstützung nach akuten Notlagen</h3>\\n        <p class=\\\"text-muted\\\">Hilfe, die nach Überschwemmungen und anderen\\n        Ereignissen dort ansetzt, wo sie unmittelbar gebraucht wird.</p>\\n      </div>\\n      <!-- Dritter Wirkungspunkt „Langfristige Projekte vor Ort\\\": wird aktiviert,\\n           sobald reale langfristige Projekte belegt sind\\n           (interner Status: confirmation-required, siehe docs/launch-blockers.md) -->\\n    </div>\\n    <p style=\\\"margin-top:var(--space-6)\\\"><a class=\\\"arrow-link\\\" href=\\\"/sri-lanka/\\\">Mehr zur Sri-Lanka-Hilfe <span aria-hidden=\\\"true\\\">→</span></a></p>\\n  </div>\\n</section>\\n\\n<!-- ============ 7. Aktuelles Hilfsprojekt ============ -->\\n<section class=\\\"section\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline overline--srilanka\\\">Im Fokus</p>\\n      <h2>Aktuelle Hilfsaktion</h2>\\n    </div>\\n    <div class=\\\"empty-state reveal\\\">\\n        <h2>Aktuelle Hilfsaktion wird dokumentiert</h2>\\n        <p>Die vollständigen Informationen, Bilder und Nachweise werden derzeit für die Veröffentlichung vorbereitet.</p>\\n        <a class=\\\"btn btn--primary\\\" href=\\\"/kontakt/\\\">Fragen zur aktuellen Hilfsaktion <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      </div>\\n  </div>\\n</section>\\n\\n<!-- ============ 8. Plant-Ceylon-Teaser ============ -->\\n<section class=\\\"section section--sand\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"split\\\">\\n      <div class=\\\"flow reveal\\\">\\n        <p class=\\\"overline\\\">Langfristiges Projekt</p>\\n        <h2>Einen Baum pflanzen. Wirkung sichtbar machen.</h2>\\n        <p>Plant Ceylon verbindet die Pflanzung tropischer Bäume mit einem persönlichen Nachweis. Unterstützer wählen eine Baumart, die in Sri Lanka gepflanzt und mit einem Namen oder einer Widmung dokumentiert werden soll.</p>\\n        <p class=\\\"text-sm text-muted\\\">Die genaue rechtliche und finanzielle Zuordnung des Projekts wird vor der Veröffentlichung transparent ergänzt.</p>\\n        <p class=\\\"hero__actions\\\" style=\\\"margin-top:var(--space-5)\\\">\\n          <a class=\\\"btn btn--primary\\\" href=\\\"/plant-ceylon/\\\">Plant Ceylon kennenlernen <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n        </p>\\n      </div>\\n      <div class=\\\"reveal\\\">\\n        <ol class=\\\"steps reveal\\\"><li><h3>Baum auswählen</h3><p>Wählen Sie eine tropische Pflanze für sich selbst oder als persönliches Geschenk.</p></li><li><h3>Pflanzung vor Ort</h3><p>Ein lokales Team wählt entsprechend der Baumart einen geeigneten Standort und bereitet die Pflanzung vor.</p></li><li><h3>Persönlichen Nachweis erhalten</h3><p>Nach der Pflanzung soll ein persönlicher Bild- oder Videonachweis mit Baum, Standort und gewünschtem Namen beziehungsweise einer Widmung übermittelt werden.</p></li><li><h3>Langfristig unterstützen</h3><p>Die Früchte der gepflanzten Bäume sollen langfristig Nahrung bereitstellen und Menschen beziehungsweise Gemeinschaften vor Ort unterstützen.</p></li></ol>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<!-- ============ 9. Transparenter Ablauf ============ -->\\n<section class=\\\"section\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"grid grid--halves\\\">\\n      <div class=\\\"section-head reveal\\\" style=\\\"margin-bottom:0\\\">\\n        <p class=\\\"overline\\\">Transparenz</p>\\n        <h2>So soll Unterstützung nachvollziehbar werden</h2>\\n        <p>Vertrauen entsteht durch nachvollziehbare Hilfe. Deshalb sollen auf dieser Website Projekte, Ansprechpartner, Spendenwege und verfügbare Nachweise so klar wie möglich dargestellt werden.</p>\\n        <!-- Ablauf: interner Status confirmationRequired: true (docs/launch-blockers.md) -->\\n      </div>\\n      <ol class=\\\"steps reveal\\\">\\n        <li><h3>Bedarf wird dokumentiert</h3><p>Ein Bedarf oder Projekt wird erfasst und beschrieben.</p></li>\\n        <li><h3>Spenden werden zugeordnet</h3><p>Jede Unterstützung wird einem Hilfszweck zugeordnet.</p></li>\\n        <li><h3>Hilfe wird organisiert</h3><p>Die Unterstützung wird vor Ort organisiert.</p></li>\\n        <li><h3>Belege werden gesammelt</h3><p>Bilder, Berichte und Belege werden zusammengetragen.</p></li>\\n        <li><h3>Fortschritte werden veröffentlicht</h3><p>Der Stand wird auf dieser Website dokumentiert.</p></li>\\n      </ol>\\n    </div>\\n  </div>\\n</section>\\n\\n<!-- ============ 10. Beweise & Dokumentation ============ -->\\n<section class=\\\"section section--paper\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Nachweise</p>\\n      <h2>Nicht nur versprechen. Fortschritt zeigen.</h2>\\n      <p>Jede künftige Projektseite unterscheidet sichtbar zwischen\\n      Originalaufnahmen, Projektberichten, externen Quellen und Illustrationen —\\n      damit Sie einordnen können, worauf sich jede Aussage stützt.</p>\\n    </div>\\n    <div class=\\\"proof-grid reveal-stagger\\\">\\n      <div class=\\\"proof-item reveal\\\"><span class=\\\"source-badge source-badge--original\\\">Originalaufnahme</span><h3>Fotos &amp; Videos vor Ort</h3><p>Unbearbeitetes Material mit Ort und Datum — wird je Hilfsaktion ergänzt.</p></div>\\n      <div class=\\\"proof-item reveal\\\"><span class=\\\"source-badge\\\">Projektbericht</span><h3>Updates &amp; Mittelverwendung</h3><p>Was wurde getan, was wurde eingesetzt, was steht an.</p></div>\\n      <div class=\\\"proof-item reveal\\\"><span class=\\\"source-badge source-badge--extern\\\">Externe Quelle</span><h3>Öffentliche Aufrufe &amp; Register</h3><p>Zitierte Aussagen Dritter werden als solche gekennzeichnet und verlinkt.</p></div>\\n      <div class=\\\"proof-item reveal\\\"><span class=\\\"source-badge source-badge--illustration\\\">Illustration</span><h3>Klar getrennt</h3><p>Illustrationen und Platzhalter tragen nie das Etikett einer Originalaufnahme.</p></div>\\n    </div>\\n  </div>\\n</section>\\n\\n<!-- ============ 11. Vorstand ============ -->\\n<section class=\\\"section\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Der Verein</p>\\n      <h2>Menschen hinter Living Charity</h2>\\n      <p>Verantwortung hat bei uns Namen. Der Vorstand ist Ihr direkter\\n      Ansprechpartner.</p>\\n    </div>\\n    <div class=\\\"grid grid--cards reveal-stagger\\\"><div class=\\\"team-card reveal\\\">\\n          <div class=\\\"team-card__portrait\\\" aria-hidden=\\\"true\\\">NS</div>\\n          <div>\\n            <p class=\\\"team-card__name\\\">Navaratnam Sivananthan</p>\\n            <p class=\\\"team-card__role\\\">Vorsitzender</p>\\n          </div>\\n        </div><div class=\\\"team-card reveal\\\">\\n          <div class=\\\"team-card__portrait\\\" aria-hidden=\\\"true\\\">OT</div>\\n          <div>\\n            <p class=\\\"team-card__name\\\">Ordin Thanapalasingham</p>\\n            <p class=\\\"team-card__role\\\">Schatzmeister</p>\\n          </div>\\n        </div><div class=\\\"team-card reveal\\\">\\n          <div class=\\\"team-card__portrait\\\" aria-hidden=\\\"true\\\">SS</div>\\n          <div>\\n            <p class=\\\"team-card__name\\\">Seevaratnam Sathianandan</p>\\n            <p class=\\\"team-card__role\\\">Schriftführer</p>\\n          </div>\\n        </div></div>\\n  </div>\\n</section>\\n\\n<!-- ============ 12. Mitmachen ============ -->\\n<section class=\\\"section section--sm section--sand\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Mitmachen</p>\\n      <h2>Möglichkeiten zu helfen</h2>\\n    </div>\\n    <div class=\\\"grid grid--cards reveal-stagger\\\">\\n      <article class=\\\"card reveal\\\"><div class=\\\"card__body\\\"><h3 class=\\\"card__title\\\"><a href=\\\"/spenden/\\\">Geld spenden</a></h3><p class=\\\"card__excerpt\\\">Einmalig oder regelmäßig — jede Spende wird einem Hilfszweck zugeordnet.</p><span class=\\\"card__link\\\">Zur Spendenseite <span aria-hidden=\\\"true\\\">→</span></span></div></article>\\n      <article class=\\\"card reveal\\\"><div class=\\\"card__body\\\"><h3 class=\\\"card__title\\\"><a href=\\\"/projekte/\\\">Projekt unterstützen</a></h3><p class=\\\"card__excerpt\\\">Gezielt für eine Hilfsaktion oder ein Projekt wie Plant Ceylon geben.</p><span class=\\\"card__link\\\">Zu den Projekten <span aria-hidden=\\\"true\\\">→</span></span></div></article>\\n      <article class=\\\"card reveal\\\"><div class=\\\"card__body\\\"><h3 class=\\\"card__title\\\"><a href=\\\"/kontakt/?thema=allgemein\\\">Sachspenden anbieten</a></h3><p class=\\\"card__excerpt\\\">Bitte vorab abstimmen — so kommt an, was wirklich gebraucht wird.</p><span class=\\\"card__link\\\">Sachspende anfragen <span aria-hidden=\\\"true\\\">→</span></span></div></article>\\n      <article class=\\\"card reveal\\\"><div class=\\\"card__body\\\"><h3 class=\\\"card__title\\\"><a href=\\\"/kontakt/?thema=ehrenamt\\\">Ehrenamtlich helfen</a></h3><p class=\\\"card__excerpt\\\">Zeit und Können einbringen — vor Ort oder aus der Ferne.</p><span class=\\\"card__link\\\">Ehrenamt anfragen <span aria-hidden=\\\"true\\\">→</span></span></div></article>\\n      <article class=\\\"card reveal\\\"><div class=\\\"card__body\\\"><h3 class=\\\"card__title\\\"><a href=\\\"/kontakt/?thema=kooperation\\\">Als Unternehmen kooperieren</a></h3><p class=\\\"card__excerpt\\\">Projektpartnerschaften und Aktionen mit nachvollziehbarer Wirkung. -hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n    </button>\\n    <nav class=\\\"site-nav\\\" id=\\\"hauptnavigation\\\" aria-label=\\\"Hauptnavigation\\\" data-nav>\\n      <ul class=\\\"site-nav__list\\\">\\n        <li><a class=\\\"site-nav__link\\\" href=\\\"/unsere-arbeit/\\\">Unsere Arbeit</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/sri-lanka/\\\">Sri Lanka</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/projekte/\\\">Projekte</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/ueber-uns/\\\">Über uns</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/aktuelles/\\\">Aktuelles</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/kontakt/\\\">Kontakt</a></li>\\n        <li><a class=\\\"btn site-nav__cta\\\" href=\\\"/spenden/\\\">Jetzt helfen</a></li>\\n      </ul>\\n    </nav>\\n  </div>\\n</header>\\n\\n<main id=\\\"hauptinhalt\\\">\\n<div class=\\\"container\\\">\\n  <nav class=\\\"breadcrumbs\\\" aria-label=\\\"Sie sind hier\\\">\\n    <ol>\\n      <li><a href=\\\"/\\\">Startseite</a></li>\\n      <li><a href=\\\"/projekte/\\\">Projekte</a></li>\\n      <li><span aria-current=\\\"page\\\">Plant Ceylon</span></li>\\n    </ol>\\n  </nav>\\n  <header class=\\\"page-head\\\">\\n    <p class=\\\"overline\\\">Langfristiges Projekt · <span class=\\\"badge badge--pruefung\\\" style=\\\"vertical-align:middle\\\">In Prüfung</span></p>\\n    <h1>Einen Baum pflanzen. Wirkung sichtbar machen.</h1>\\n    <p class=\\\"lead\\\">Plant Ceylon verbindet die Pflanzung tropischer Bäume mit einem persönlichen Nachweis. Unterstützer wählen eine Baumart, die in Sri Lanka gepflanzt und mit einem Namen oder einer Widmung dokumentiert werden soll.</p>\\n  </header>\\n</div>\\n\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"split\\\">\\n      <div class=\\\"reveal\\\">\\n        <h2 style=\\\"margin-bottom:var(--space-5)\\\">So soll es ablaufen</h2>\\n        <ol class=\\\"steps reveal\\\"><li><h3>Baum auswählen</h3><p>Wählen Sie eine tropische Pflanze für sich selbst oder als persönliches Geschenk.</p></li><li><h3>Pflanzung vor Ort</h3><p>Ein lokales Team wählt entsprechend der Baumart einen geeigneten Standort und bereitet die Pflanzung vor.</p></li><li><h3>Persönlichen Nachweis erhalten</h3><p>Nach der Pflanzung soll ein persönlicher Bild- oder Videonachweis mit Baum, Standort und gewünschtem Namen beziehungsweise einer Widmung übermittelt werden.</p></li><li><h3>Langfristig unterstützen</h3><p>Die Früchte der gepflanzten Bäume sollen langfristig Nahrung bereitstellen und Menschen beziehungsweise Gemeinschaften vor Ort unterstützen.</p></li></ol>\\n        <p class=\\\"text-sm text-muted\\\" style=\\\"margin-top:var(--space-5)\\\">Der persönliche Nachweis wird nach erfolgter Pflanzung erstellt und in der Regel innerhalb von bis zu 14 Tagen übermittelt.</p>\\n      </div>\\n      <div class=\\\"flow reveal\\\">\\n        <h2>Acht Baumarten zur Auswahl</h2>\\n        <div class=\\\"tree-grid reveal-stagger\\\"><div class=\\\"tree-item reveal\\\"><strong>Kokospalme</strong><span>Derzeit 44 €</span></div><div class=\\\"tree-item reveal\\\"><strong>Mangobaum</strong><span>Derzeit 44 €</span></div><div class=\\\"tree-item reveal\\\"><strong>Bananenpflanze</strong><span>Derzeit 44 €</span></div><div class=\\\"tree-item reveal\\\"><strong>Jackfruchtbaum</strong><span>Derzeit 44 €</span></div><div class=\\\"tree-item reveal\\\"><strong>Papayapflanze</strong><span>Derzeit 44 €</span></div><div class=\\\"tree-item reveal\\\"><strong>Ananaspflanze</strong><span>Derzeit 44 €</span></div><div class=\\\"tree-item reveal\\\"><strong>Rambutanbaum</strong><span>Derzeit 44 €</span></div><div class=\\\"tree-item reveal\\\"><strong>Mangostanbaum</strong><span>Derzeit 44 €</span></div></div>\\n        <p class=\\\"text-sm text-muted\\\">Die genaue rechtliche und finanzielle Zuordnung des Projekts wird vor der Veröffentlichung transparent ergänzt.</p>\\n        <p class=\\\"source-line\\\">\\n          <span class=\\\"source-badge source-badge--extern\\\">Externe Projektseite</span>\\n          <a class=\\\"external-link\\\" href=\\\"https://plantceylon.com/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Plant Ceylon kennenlernen</a>\\n        </p>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section--paper section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Einordnung</p>\\n      <h2>Was die Beiträge bewirken sollen</h2>\\n      <p>Nach Angaben des Projekts sollen die Beiträge für Pflanzung,\\n      Organisation, Dokumentation, Pflege und die Unterstützung beteiligter\\n      Menschen eingesetzt werden. Der Baum soll einem Namen oder einer Widmung\\n      zugeordnet werden; der Nachweis soll per WhatsApp oder E-Mail übermittelt\\n      werden können, auch anonyme Bestellungen sollen möglich sein.</p>\\n      <p class=\\\"text-sm text-muted\\\">Diese Angaben sind Projektbeschreibungen des\\n      Betreibers. Die rechtliche und finanzielle Zuordnung — einschließlich der\\n      Frage, ob der Beitrag eine Spende oder ein Kaufpreis ist und ob eine\\n      Zuwendungsbestätigung möglich ist — wird vor der Veröffentlichung\\n      transparent ergänzt.</p>\\n    </div>\\n    <div class=\\\"proof-grid reveal-stagger\\\">\\n      <div class=\\\"proof-item reveal\\\"><span class=\\\"source-badge source-badge--original\\\">Originalaufnahme</span><h3>Pflanz-Dokumentation</h3><p>Unbearbeitete Fotos und Videos der Pflanzflächen mit Ort und Datum — werden ergänzt, sobald verifiziertes Material vorliegt.</p></div>\\n      <div class=\\\"proof-item reveal\\\"><span class=\\\"source-badge\\\">Projektbericht</span><h3>Regelmäßige Updates</h3><p>Fortschritte, Pflege und Wirkung der Pflanzungen — in Vorbereitung.</p></div>\\n      <div class=\\\"proof-item reveal\\\"><span class=\\\"source-badge source-badge--illustration\\\">Illustration</span><h3>Bildmaterial in Prüfung</h3><p>Bis verifizierte Originalaufnahmen vorliegen, verzichtet diese Seite bewusst auf Projektfotos.</p></div>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section-forest cta-final\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"reveal\\\">\\n      <h2>Fragen zu Plant Ceylon?</h2>\\n      <p>Wir beantworten sie gern — auch zur geplanten Zuordnung des Projekts.</p>\\n    </div>\\n    <div class=\\\"cta-final__actions reveal\\\">\\n      <a class=\\\"btn btn--primary\\\" href=\\\"/kontakt/?thema=plant-ceylon\\\">Kontakt aufnehmen <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      <a class=\\\"btn btn--ghost external-link\\\" href=\\\"https://plantceylon.com/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Zur Projektseite</a>\\n    </div>\\n  </div>\\n</section>\\n</main>\\n<footer class=\\\"site-footer\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"site-footer__grid\\\">\\n      <div class=\\\"site-footer__brand\\\">\\n        <a class=\\\"brand\\\" href=\\\"/\\\">\\n          <svg class=\\\"brand__mark\\\" viewBox=\\\"0 0 40 40\\\" aria-hidden=\\\"true\\\" focusable=\\\"false\\\">\\n            <rect width=\\\"40\\\" height=\\\"40\\\" rx=\\\"8\\\" fill=\\\"#f2f4ef\\\" opacity=\\\"0.12\\\"/>\\n            <text x=\\\"20\\\" y=\\\"27\\\" text-anchor=\\\"middle\\\" font-family=\\\"Manrope, sans-serif\\\" font-size=\\\"17\\\" font-weight=\\\"800\\\" fill=\\\"#f2f4ef\\\">LC</text>\\n            <rect x=\\\"8\\\" y=\\\"31\\\" width=\\\"24\\\" height=\\\"2.5\\\" rx=\\\"1.25\\\" fill=\\\"#b86548\\\"/>\\n          </svg>\\n          <span class=\\\"brand__name\\\">Living Charity\\n            <span class=\\\"brand__sub\\\">Eingetragener Verein</span>\\n          </span>\\n        </a>\\n        <address style=\\\"margin-top:1.25rem\ \\"media-pending\\\">Verifiziertes Bildmaterial in Prüfung.</div></div>\\n        <div class=\\\"card__body\\\">\\n          <p class=\\\"card__meta\\\"><span class=\\\"badge badge--pruefung\\\">In Prüfung</span><span>Sri Lanka</span></p>\\n          <h3 class=\\\"card__title\\\"><a href=\\\"/plant-ceylon/\\\">Plant Ceylon</a></h3>\\n          <p class=\\\"card__excerpt\\\">Tropische Bäume pflanzen, persönlich dokumentiert —\\n          die rechtliche Zuordnung des Projekts wird transparent ergänzt.</p>\\n          <span class=\\\"card__link\\\">Zum Baumprojekt <span aria-hidden=\\\"true\\\">→</span></span>\\n        </div>\\n      </article>\\n    </div>\\n    <div style=\\\"margin-top:var(--space-7)\\\">\\n      <div class=\\\"empty-state reveal\\\">\\n        <h2>Aktuelle Hilfsaktion wird dokumentiert</h2>\\n        <p>Die vollständigen Informationen, Bilder und Nachweise werden derzeit für die Veröffentlichung vorbereitet.</p>\\n        <a class=\\\"btn btn--primary\\\" href=\\\"/kontakt/\\\">Fragen zur aktuellen Hilfsaktion <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section--sand section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"grid grid--halves\\\">\\n      <div class=\\\"reveal\\\">\\n        <p class=\\\"overline\\\">So lesen Sie unsere Projektseiten</p>\\n        <h2>Ein Status, der etwas bedeutet</h2>\\n        <p>Jedes Projekt trägt genau einen Status — so sehen Sie sofort, wo Ihre\\n        Unterstützung gerade wirkt.</p>\\n      </div>\\n      <div class=\\\"flow reveal\\\">\\n        <p><span class=\\\"badge badge--geplant\\\">Geplant</span> — Vorbereitung läuft, Unterstützung wird gesammelt.</p>\\n        <p><span class=\\\"badge badge--aktiv\\\">Aktiv</span> — die Maßnahme wird gerade umgesetzt.</p>\\n        <p><span class=\\\"badge badge--laufend\\\">Laufende Unterstützung</span> — dauerhafte Hilfe ohne festes Enddatu  class=\\\"site-nav__list\\\">\\n        <li><a class=\\\"site-nav__link\\\" href=\\\"/unsere-arbeit/\\\">Unsere Arbeit</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/sri-lanka/\\\">Sri Lanka</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/projekte/\\\">Projekte</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/ueber-uns/\\\">Über uns</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/aktuelles/\\\">Aktuelles</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/kontakt/\\\">Kontakt</a></li>\\n        <li><a class=\\\"btn site-nav__cta\\\" href=\\\"/spenden/\\\">Jetzt helfen</a></li>\\n      </ul>\\n    </nav>\\n  </div>\\n</header>\\n\\n<main id=\\\"hauptinhalt\\\">\\n<div class=\\\"container\\\">\\n  <nav class=\\\"breadcrumbs\\\" aria-label=\\\"Sie sind hier\\\">\\n    <ol>\\n      <li><a href=\\\"/\\\">Startseite</a></li>\\n      <li><span aria-current=\\\"page\\\">Spenden</span></li>\\n    </ol>\\n  </nav>\\n  <header class=\\\"page-head\\\">\\n    <p class=\\\"overline\\\">Spenden &amp; Unterstützung</p>\\n    <h1>Ihre Unterstützung kann direkt helfen.</h1>\\n    <p class=\\\"lead\\\">Jeder Beitrag kann dazu beitragen, Lebensmittel, Versorgung\\n    und konkrete Hilfsmaßnahmen für Menschen in Sri Lanka zu ermöglichen.</p>\\n  </header>\\n</div>\\n\\n<section class=\\\"impact5\\\" aria-label=\\\"Was ein kleiner Beitrag bewirken kann\\\">\\n      <div class=\\\"container impact5__grid\\\">\\n        <p class=\\\"impact5__figure reveal\\\">5 €<small>Ein Tag Nahrung — laut Spendenaufruf</small></p>\\n        <div class=\\\"impact5__body reveal\\\">\\n          <h2>Schon ein kleiner Beitrag kann einen Tag Hilfe bedeuten.</h2>\\n          <p>Nach Angaben des öffentlichen Spendenaufrufs von Dr. Umes Arunagirinathan kann bereits ein Beitrag von 5 Euro dabei helfen, eine Familie in Sri Lanka einen Tag lang mit Nahrung zu versorgen.</p>\\n          <p class=\\\"impact5__note\\\">Die tatsächliche Verwendung richtet sich nach dem aktuellen Bedarf und der jeweiligen Hilfsaktion.</p>\\n          <p class=\\\"source-line\\\">\\n            <span class=\\\"source-badge source-badge--extern\\\">Externe Quelle</span>\\n            <a class=\\\"external-link\\\" href=\\\"https://de.linkedin.com/posts/dr-umes-arunagirinathan-991b21125_spendenaufruf-f%C3%BCr-die-flutopfer-in-sri-lanka-activity-7400661832572772353-tqWa\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Quelle und Spendenaufruf ansehen</a>\\n          </p>\\n        </div>\\n      </div>\\n    </section>\\n\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"split\\\" style=\\\"align-items:start\\\">\\n      <div class=\\\"reveal\\\">\\n        <div class=\\\"donation-panel\\\">\\n      <p class=\\\"donation-panel__label\\\">Spenden per Überweisung</p>\\n      <p class=\\\"text-sm text-muted\\\" style=\\\"margin-top:.5rem\\\">Wählen Sie einen Betrag als Orientierung — überwiesen wird ganz normal über Ihre Bank.</p>\\n      <div class=\\\"amount-picker\\\" role=\\\"group\\\" aria-label=\\\"Spendenbetrag als Orientierung wählen\\\"><button type=\\\"button\\\" aria-pressed=\\\"true\\\" data-amount=\\\"5\\\">5 €</button><button type=\\\"button\\\" aria-pressed=\\\"false\\\" data-amount=\\\"10\\\">10 €</button><button type=\\\"button\\\" aria-pressed=\\\"false\\\" data-amount=\\\"25\\\">25 €</button><button type=\\\"button\\\" aria-pressed=\\\"false\\\" data-amount=\\\"50\\\">50 €</button><button type=\\\"button\\\" aria-pressed=\\\"false\\\" data-amount=\\\"frei\\\">Freier Betrag</button></div>\\n      <dl>\\n        <dt>Empfänger</dt><dd>Living Charity e. V.</dd>\\n        <dt>IBAN</dt><dd><span class=\\\"iban\\\" id=\\\"iban-value\\\">DE18 3845 0000 1000 2149 63</span></dd>\\n        <dt>BIC</dt><dd><span id=\\\"bic-value\\\">WELADED1GMB</span></dd>\\n        <dt>Bank</dt><dd>Sparkasse Gummersbach-Bergneustadt</dd>\\n        <dt>Verwendungszweck</dt><dd id=\\\"purpose-value\\\">Spende Living Charity</dd>\\n      </dl>\\n      <div class=\\\"donation-panel__actions\\\">\\n        <button type=\\\"button\\\" class=\\\"btn btn--primary copy-btn\\\" data-copy-target=\\\"iban-value\\\" data-copy-plain=\\\"DE18384500001000214963\\\">IBAN kopieren<span class=\\\"copy-btn__feedback\\\" role=\\\"status\\\">Kopiert ✓</span></button>\\n        <button type=\\\"button\\\" class=\\\"btn btn--ghost copy-btn\\\" data-copy-target=\\\"bic-value\\\" data-copy-plain=\\\"WELADED1GMB\\\">BIC kopieren<span class=\\\"copy-btn__feedback\\\" role=\\\"status\\\">Kopiert ✓</span></button>\\n      </div>\\n      <div style=\\\"display:flex; gap:1rem; align-items:center; margin-top:var(--space-5); flex-wrap:wrap\\\">\\n        <div class=\\\"qr-slot\\\" aria-hidden=\\\"true\\\"><span>QR-Überweisung<br>(Girocode) folgt nach Bestätigung der Bankverbindung</span></div>\\n        <p class=\\\"text-sm text-muted\\\" style=\\\"flex:1; min-width:14rem\\\">Informationen zur Ausstellung einer Spendenbescheinigung erhalten Sie auf Anfrage über info@livingcharity.de.</p>\\n      </div>\\n    </div>\\n      </div>\\n      <div class=\\\"flow-lg reveal\\\">\\n        <div>\\n          <h2>Allgemein oder gezielt?</h2>\\n          <p><strong>Allgemeine Spende:</strong> Der Verein setzt sie dort ein,\\n          wo sie am dringendsten gebraucht wird — Verwendungszweck\\n          „Spende Living Charity\\\".</p>\\n          <p><strong>Sri-Lanka-Hilfe:</strong> Ergänzen Sie den Verwendungszweck\\n          um „Sri Lanka\\\", wenn Ihre Spende der aktuellen Hilfe zugutekommen soll.</p>\\n          <p><strong>Plant Ceylon:</strong> Das Baumprojekt hat eine\\n          <a href=\\\"/plant-ceylon/\\\">eigene Projektseite</a> mit allen Details.</p>\\n        </div>\\n        <div>\\n          <h2>Spendenbescheinigung</h2>\\n          <p>Informationen zur Ausstellung einer Spendenbescheinigung erhalten Sie auf Anfrage über info@livingcharity.de.</p>\\n        </div>\\n        <div>\\n          <h2>Was mit Ihrer Spende passiert</h2>\\n          <p>Den Ablauf, an dem wir uns ausrichten, zeigen wir auf der\\n          <a href=\\\"/transparenz/\\\">Transparenzseite</a>; Fortschritte\\n          veröffentlichen wir unter <a href=\\\"/aktuelles/\\\">Aktuelles</a>.</p>\\n        </div>\\n        <div>\\n          <h2>Fragen zur Spende?</h2>\\n          <p>Schreiben Sie an <a href=\\\"mailto:info@livingcharity.de\\\">info@livingcharity.de</a>\\n          oder nutzen Sie das <a href=\\\"/kontakt/?thema=spende\\\">Kontaktformular</a> —\\n          wir antworten persönlich.</p>\\n        </div>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section--paper section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Gut zu wissen</p>\\n      <h2>Häufige Fragen zum Spenden</h2>\\n    </div>\\n    <div class=\\\"faq reveal\\\">\\n      <details>\\n        <summary>Ist meine Spende sicher?</summary>\\n        <div class=\\\"faq__body\\\"><p>Die Überweisung läuft direkt über Ihre Bank auf das\\n        Vereinskonto bei der Sparkasse Gummersbach-Bergneustadt — ohne Zwischenhändler. Diese\\n        Website verarbeitet bei einer Überweisung keine Daten von Ihnen.</p></div>\\n      </details>\\n      <details>\\n        <summary>Kann ich online mit Karte oder PayPal spenden?</summary>\\n        <div class=\\\"faq__body\\\"><p>Derzeit nicht — wir verzichten bewusst auf die\\n        Darstellung von Zahlungswegen, die noch nicht eingerichtet sind. Sobald\\n        ein Spendendienst geprüft und eingerichtet ist, finden Sie ihn hier mit\\n        allen Angaben zu Anbieter, Datenschutz und möglichen Gebühren.</p></div>\\n      </details>\\n      <details>\\n        <summary>Wie erfahre ich, was meine Spende bewirkt hat?</summary>\\n        <div class=\\\"faq__body\\\"><p>Über die Projektseiten und den Bereich\\n        <a href=\\\"/aktuelles/\\\">Aktuelles</a>. Dort dokumentieren wir Fortschritte\\n        mit Bildern, Berichten und Belegen, sobald sie vorliegen.</p></div>\\n      </details>\\n      <details>\\n        <summary>Kann ich auch anders helfen als mit Geld?</summary>\\n        <div class=\\\"faq__body\\\"><p>Ja — mit Zeit, Können, Sachspenden oder als\\n        Unternehmen. Sprechen Sie uns über das\\n        <a href=\\\"/kontakt/\\\">Kontaktformular</a> an.</p></div>\\n      </details>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section-forest cta-final\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"reveal\\\">\\n      <h2>Lieber erst den Verein kennenlernen?</h2>\\n      <p>Verständlich. Schauen Sie sich an, wer wir sind und woran wir arbeiten.</p>\\n    </div>\\n    <div class=\\\"cta-final__actions reveal\\\">\\n      <a class=\\\"btn btn--primary\\\" href=\\\"/ueber-uns/\\\">Über Living Charity <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      <a class=\\\"btn btn--ghost\\\" href=\\\"/unsere-arbeit/\\\">Unsere Arbeit</a>\\n    </div>\\n  </div>\\n</section>\\n</main>\\n<footer class=\\\"site-footer\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"site-footer__grid\\\">\\n      <div class=\\\"site-footer__brand\\\">\\n        <a class=\\\"brand\\\" href=\\\"/\\\">\\n          <svg class=\\\"brand__mark\\\" viewBox=\\\"0 0 40 40\\\" aria-hidden=\\\"true\\\" focusable=\\\"false\\\">\\n            <rect width=\\\"40\\\" height=\\\"40\\\" rx=\\\"8\\\" fill=\\\"#f2f4ef\\\" opacity=\\\"0.12\\\"/>\\n            <text x=\\\"20\\\" y=\\\"27\\\" text-anchor=\\\"middle\\\" font-family=\\\"Manrope, sans-serif\\\" font-size=\\\"17\\\" font-weight=\\\"800\\\" fill=\\\"#f2f4ef\\\">LC</text>\\n            <rect x=\\\"8\\\" y=\\\"31\\\" width=\\\"24\\\" height=\\\"2.5\\\" rx=\\\"1.25\\\" fill=\\\"#b86548\\\"/>\\n          </svg>\\n          <span class=\\\"brand__name\\\">Living Charity\\n            <span class=\\\"brand__sub\\\">Eingetragener Verein</span>\\n          </span>\\n kedin.com/posts/dr-umes-arunagirinathan-991b21125_spendenaufruf-f%C3%BCr-die-flutopfer-in-sri-lanka-activity-7400661832572772353-tqWa\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Quelle und Spendenaufruf ansehen</a>\\n          </p>\\n        </div>\\n      </div>\\n    </section>\\n\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"split\\\">\\n      <div class=\\\"flow-lg reveal\\\">\\n        <div>\\n          <h2>Der öffentliche Spendenaufruf</h2>\\n          <p>Der Arzt und Autor Dr. Umes Arunagirinathan hat öffentlich zur\\n          Unterstützung der Flutopfer in Sri Lanka aufgerufen. Er kam selbst als\\n          Flüchtlingskind aus Sri Lanka nach Deutschland, kennt die genannten\\n          Vereine persönlich und nennt Living Charity als eine der\\n          Spendenmöglichkeiten. Nach seiner Aussage sollen die Spenden direkt\\n          bei den Betroffenen ankommen.</p>\\n          <p class=\\\"source-line\\\">\\n            <span class=\\\"source-badge source-badge--extern\\\">Externe Quelle</span>\\n            <a class=\\\"external-link\\\" href=\\\"https://de.linkedin.com/posts/dr-umes-arunagirinathan-991b21125_spendenaufruf-f%C3%BCr-die-flutopfer-in-sri-lanka-activity-7400661832572772353-tqWa\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Öffentlichen Spendenaufruf ansehen</a>\\n          </p>\\n        </div>\\n        <div>\\n          <h2>Wofür gesammelt wird</h2>\\n          <p><strong>Lebensmittelhilfe:</strong> Grundversorgung für Familien,\\n          die durch eine akute Notlage ihre Lebensgrundlage verloren haben.</p>\\n          <p><strong>Unterstützung nach akuten Notlagen:</strong> Hilfe, die nach\\n          Überschwemmungen und anderen Ereignissen unmittelbar ansetzt.</p>\\n          <!-- „Langfristige Projekte vor Ort\\\" wird ergänzt, sobald belegt\\n               (interner Status: confirmation-required) -->\\n        </div>\\n      </div>\\n      <div class=\\\"flow reveal\\\">\\n kt/\\\">Kontakt</a></li>\\n        <li><a class=\\\"btn site-nav__cta\\\" href=\\\"/spenden/\\\">Jetzt helfen</a></li>\\n      </ul>\\n    </nav>\\n  </div>\\n</header>\\n\\n<main id=\\\"hauptinhalt\\\">\\n<div class=\\\"container\\\">\\n  <nav class=\\\"breadcrumbs\\\" aria-label=\\\"Sie sind hier\\\">\\n    <ol>\\n      <li><a href=\\\"/\\\">Startseite</a></li>\\n      <li><span aria-current=\\\"page\\\">Transparenz</span></li>\\n    </ol>\\n  </nav>\\n  <header class=\\\"page-head\\\">\\n    <p class=\\\"overline\\\">Transparenz</p>\\n    <h1>Nachvollziehbare Hilfe als Anspruch</h1>\\n    <p class=\\\"lead\\\">Vertrauen entsteht durch nachvollziehbare Hilfe. Deshalb sollen auf dieser Website Projekte, Ansprechpartner, Spendenwege und verfügbare Nachweise so klar wie möglich dargestellt werden.</p>\\n  </header>\\n</div>\\n\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"grid grid--halves\\\" style=\\\"align-items:start\\\">\\n      <div class=\\\"reveal\\\">\\n        <h2 style=\\\"margin-bottom:var(--space-5)\\\">So soll Unterstützung nachvollziehbar werden</h2>\\n        <ol class=\\\"steps\\\">\\n          <li><h3>Bedarf wird dokumentiert</h3><p>Ein Bedarf oder Projekt wird erfasst und beschrieben.</p></li>\\n          <li><h3>Spenden werden zugeordnet</h3><p>Jede Unterstützung wird einem Hilfszweck zugeordnet.</p></li>\\n          <li><h3>Hilfe wird organisiert</h3><p>Die Unterstützung wird vor Ort organisiert.</p></li>\\n          <li><h3>Belege werden gesammelt</h3><p>Bilder, Berichte und Belege werden zusammengetragen.</p></li>\\n          <li><h3>Fortschritte werden veröffentlicht</h3><p>Der Stand wird auf dieser Website dokumentiert.</p></li>\\n        </ol>\\n      </div>\\n      <div class=\\\"flow reveal\\\">\\n        <h2>Wie wir mit Nachweisen umgehen</h2>\\n        <p>Jede Aussage auf dieser Website soll einordbar sein. Dafür\\n        unterscheiden wir sichtbar:</p>\\n        <div class=\\\"flow\\\">\\n          <p><span class=\\\"source-badge source-badge--original\\\">Originalaufnahme</span> — unbearbeitetes Material mit Ort und Datum.</p>\\n          <p><span class=\\\"source-badge\\\">Projektbericht</span> — Berichte des Vereins über Fortschritt und Mittelverwendung.</p>\\n          <p><span class=\\\"source-badge source-badge--extern\\\">Externe Quelle</span> — zitierte Aussagen Dritter, stets verlinkt.</p>\\n          <p><span class=\\\"source-badge source-badge--illustration\\\">Illustration</span> — erkennbar keine Beweisfotografie.</p>\\n        </div>\\n        <p>Zahlen veröffentlichen wir nur mit Quelle, Zeitraum und Zählweise.\\n        Wo Angaben noch geprüft werden — etwa die rechtliche Zuordnung von\\n        <a href=\\\"/plant-ceylon/\\\">Plant Ceylon</a> — kennzeichnen wir das offen\\n        als „in Prüfung\\\".</p>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section--paper section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Registerdaten</p>\\n      <h2>Öffentlich überprüfbar</h2>\\n      <p>Living Charity e. V. ist seit dem 16. Juni 2010 beim\\n      Amtsgericht Köln unter VR 16395 eingetragen.\\n      Diese Angaben können Sie jederzeit im Vereinsregister prüfen.</p>\\n    </div>\\n    <div class=\\\"hero__actions reveal\\\">\\n      <a class=\\\"btn btn--ghost\\\" href=\\\"/ueber-uns/\\\">Vorstand &amp; Verein</a>\\n      <a class=\\\"btn btn--ghost\\\" href=\\\"/aktuelles/\\\">Berichte lesen</a>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section-forest cta-final\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"reveal\\\">\\n      <h2>Noch Fragen zur Mittelverwendung?</h2>\\n      <p>Stellen Sie sie uns direkt — wir antworten persönlich.</p>\\n    </div>\\n    <div class=\\\"cta-final__actions reveal\\\">\\n      <a class=\\\"btn btn--primary\\\" href=\\\"/kontakt/\\\">Kontakt aufn
