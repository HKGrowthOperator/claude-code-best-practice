"brand__name\\\">Living Charity\\n        <span class=\\\"brand__sub\\\">Eingetragener Verein · Bergneustadt</span>\\n      </span>\\n    </a>\\n    <button class=\\\"nav-toggle\\\" type=\\\"button\\\" aria-expanded=\\\"false\\\" aria-controls=\\\"hauptnavigation\\\" data-nav-toggle>\\n      <span class=\\\"visually-hidden\\\">Menü öffnen oder schließen</span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n    </button>\\n    <nav class=\\\"site-nav\\\" id=\\\"hauptnavigation\\\" aria-label=\\\"Hauptnavigation\\\" data-nav>\\n      <ul class=\\\"site-nav__list\\\">\\n        <li><a class=\\\"site-nav__link\\\" href=\\\"/unsere-arbeit/\\\">Unsere Arbeit</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/sri-lanka/\\\">Sri Lanka</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/projekte/\\\">Projekte</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/ueber-uns/\\\" aria-current=\\\"page\\\">Über uns</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/aktuelles/\\\">Aktuelles</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/kontakt/\\\">Kontakt</a></li>\\n        <li><a class=\\\"btn site-nav__cta\\\" href=\\\"/spenden/\\\">Jetzt helfen</a></li>\\n      </ul>\\n    </nav>\\n  </div>\\n</header>\\n\\n<main id=\\\"hauptinhalt\\\">\\n<div class=\\\"container\\\">\\n  <nav class=\\\"breadcrumbs\\\" aria-label=\\\"Sie sind hier\\\">\\n    <ol>\\n      <li><a href=\\\"/\\\">Startseite</a></li>\\n      <li><span aria-current=\\\"page\\\">Über uns</span></li>\\n    </ol>\\n  </nav>\\n  <header class=\\\"page-head\\\">\\n    <p class=\\\"overline\\\">Über uns</p>\\n    <h1>Ein Verein, der ansprechbar ist</h1>\\n    <p class=\\\"lead\\\">Living Charity e.&nbsp;V. ist seit dem 16. Juni 2010\\n    beim Amtsgericht Köln eingetragen (VR 16395)\\n    und in Bergneustadt zu Hause. Hier finden Sie die Menschen, die Fakten und\\n    die Haltung hinter unserer Hilfe.</p>\\n  </header>\\n</div>\\n\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"split split--asym\\\">\\n      <div class=\\\"flow-lg reveal\\\">\\n        <div>\\n          <p class=\\\"overline\\\">Unser Auftrag</p>\\n          <h2>Wofür es uns gibt</h2>\\n          <p>Living Charity e. V. ist ein seit 2010 eingetragener Verein mit Sitz in Bergneustadt. Der Verein sammelt Spenden und organisiert Unterstützung für Menschen in akuten Notlagen. Ein besonderer Schwerpunkt liegt auf Hilfsaktionen für Menschen in Sri Lanka.</p>\\n          <p>Living Charity möchte Menschen in schwierigen Lebenssituationen praktisch unterstützen, Solidarität fördern und Spenden möglichst direkt in konkrete Hilfsmaßnahmen überführen.</p>\\n        </div>\\n        <div>\\n          <h2>Unser Schwerpunkt</h2>\\n          <p>Ein Schwerpunkt der aktuellen Arbeit liegt auf der Unterstützung von Menschen in Sri Lanka. Insbesondere nach Überschwemmungen und anderen akuten Notlagen werden Spenden für Lebensmittel und direkte Versorgungshilfe gesammelt.</p>\\n          <p><a class=\\\"arrow-link\\\" href=\\\"/sri-lanka/\\\">Zur Sri-Lanka-Hilfe <span aria-hidden=\\\"true\\\">→</span></a></p>\\n        </div>\\n      </div>\\n      <div class=\\\"info-card reveal\\\">\\n        <h3>Living Charity e. V.</h3>\\n        <address>\\n          Kölner Straße 64<br>\\n          51702 Bergneustadt<br>\\n          <a href=\\\"mailto:info@livingcharity.de\\\">info@livingcharity.de</a>\\n        </address>\\n        <hr class=\\\"rule\\\" style=\\\"margin-block:1.25rem\\\">\\n        <p class=\\\"text-sm text-muted\\\">Rechtsform: Eingetragener Verein<br>\\n        Registergericht: Amtsgericht Köln<br>\\n        Registernummer: VR 16395<br>\\n        Eingetragen seit: 16. Juni 2010</p>\\n        <p class=\\\"text-sm text-muted\\\">Diese Angaben können Sie jederzeit mit dem\\n        Vereinsregister abgleichen.</p>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section--sand\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Vorstand</p>\\n      <h2>Menschen hinter Living Charity</h2>\\n    </div>\\n    <div class=\\\"grid grid--cards reveal-stagger\\\"><div class=\\\"team-card reveal\\\">\\n          <div class=\\\"team-card__portrait\\\" aria-hidden=\\\"true\\\">NS</div>\\n          <div>\\n            <p class=\\\"team-card__name\\\">Navaratnam Sivananthan</p>\\n            <p class=\\\"team-card__role\\\">Vorsitzender</p>\\n          </div>\\n        </div><div class=\\\"team-card reveal\\\">\\n          <div class=\\\"team-card__portrait\\\" aria-hidden=\\\"true\\\">OT</div>\\n          <div>\\n            <p class=\\\"team-card__name\\\">Ordin Thanapalasingham</p>\\n            <p class=\\\"team-card__role\\\">Schatzmeister</p>\\n          </div>\\n        </div><div class=\\\"team-card reveal\\\">\\n          <div class=\\\"team-card__portrait\\\" aria-hidden=\\\"true\\\">SS</div>\\n          <div>\\n            <p class=\\\"team-card__name\\\">Seevaratnam Sathianandan</p>\\n            <p class=\\\"team-card__role\\\">Schriftführer</p>\\n          </div>\\n        </div></div>\\n    <!-- Porträts folgen als echte Fotografien; bis dahin neutrale\\n         typografische Platzhalter — keine KI-Porträts. -->\\n  </div>\\n</section>\\n\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Häufige Fragen</p>\\n      <h2>Woran Sie uns messen können</h2>\\n    </div>\\n    <div class=\\\"faq reveal\\\">\\n      <details>\\n        <summary>Wie erfahre ich, was mit meiner Spende passiert?</summary>\\n        <div class=\\\"faq__body\\\"><p>Über die <a href=\\\"/projekte/\\\">Projektseiten</a> und\\n        <a href=\\\"/aktuelles/\\\">Aktuelles</a>. Den Ablauf, an dem wir uns\\n        ausrichten, beschreibt die <a href=\\\"/transparenz/\\\">Transparenzseite</a>.</p></div>\\n      </details>\\n      <details>\\n        <summary>Erhalte ich eine Spendenbescheinigung?</summary>\\n        <div class=\\\"faq__body\\\"><p>Informationen zur Ausstellung einer Spendenbescheinigung erhalten Sie auf Anfrage über info@livingcharity.de.</p></div>\\n      </details>\\n      <details>\\n        <summary>Kann ich den Verein persönlich erreichen?</summary>\\n        <div class=\\\"faq__body\\\"><p>Ja. Schreiben Sie an\\n        <a href=\\\"mailto:info@livingcharity.de\\\">info@livingcharity.de</a> oder nutzen Sie das\\n        <a href=\\\"/kontakt/\\\">Kontaktformular</a>.</p></div>\\n      </details>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section-forest cta-final\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"reveal\\\">\\n      <h2>Lernen Sie unsere Arbeit kennen</h2>\\n      <p>Am besten versteht man einen Verein über das, was er tut.</p>\\n    </div>\\n    <div class=\\\"cta-final__actions reveal\\\">\\n      <a class=\\\"btn btn--primary\\\" href=\\\"/unsere-arbeit/\\\">Unsere Arbeit <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      <a class=\\\"btn btn--ghost\\\" href=\\\"/kontakt/\\\">Kontakt aufnehmen</a>\\n    </div>\\n  </div>\\n</section>\\n</main>\\n<footer class=\\\"site-footer\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"site-footer__grid\\\">\\n      <div class=\\\"site-footer__brand\\\">\\n        <a class=\\\"brand\\\" href=\\\"/\\\">\\n          <svg class=\\\"brand__mark\\\" viewBox=\\\"0 0 40 40\\\" aria-hidden=\\\"true\\\" focusable=\\\"false\\\">\\n            <rect width=\\\"40\\\" height=\\\"40\\\" rx=\\\"8\\\" fill=\\\"#f2f4ef\\\" opacity=\\\"0.12\\\"/>\\n            <text x=\\\"20\\\" y=\\\"27\\\" text-anchor=\\\"middle\\\" font-family=\\\"Manrope, sans-serif\\\" font-size=\\\"17\\\" font-weight=\\\"800\\\" fill=\\\"#f2f4ef\\\">LC</text>\\n            <rect x=\\\"8\\\" y=\\\"31\\\" width=\\\"24\\\" height=\\\"2.5\\\" rx=\\\"1.25\\\" fill=\\\"#b86548\\\"/>\\n          </svg>\\n          <span class=\\\"brand__name\\\">Living Charity\\n            <span class=\\\"brand__sub\\\">Eingetragener Verein</span>\\n          </span>\\n        </a>\\n        <address style=\\\"margin-top:1.25rem\\\">\\n          Living Charity e. V.<br>\\n          Kölner Straße 64<br>\\n          51702 Bergneustadt<br>\\n          <a href=\\\"mailto:info@livingcharity.de\\\">info@livingcharity.de</a>\\n          <!-- Telefonzeile + Click-to-Call: aktivieren, sobald bestätigt\\n               (site.json → org.phone; interner Status: confirmation-required) -->\\n        </address>\\n        <p class=\\\"site-footer__register\\\">\\n          Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010\\n        </p>\\n        <!-- Social-Media-Icons erst mit verifizierten Profilen (org.socialLinks) -->\\n      </div>\\n      <nav aria-label=\\\"Der Verein\\\"><h2>Der Verein</h2><ul><li><a href=\\\"/unsere-arbeit/\\\">Unsere Arbeit</a></li><li><a href=\\\"/sri-lanka/\\\">Sri Lanka</a></li><li><a href=\\\"/projekte/\\\">Projekte</a></li><li><a href=\\\"/ueber-uns/\\\">Über uns</a></li><li><a href=\\\"/transparenz/\\\">Transparenz</a></li></ul></nav>\\n<nav aria-label=\\\"Helfen\\\"><h2>Helfen</h2><ul><li><a href=\\\"/spenden/\\\">Spenden</a></li><li><a href=\\\"/plant-ceylon/\\\">Plant Ceylon</a></li><li><a href=\\\"/aktuelles/\\\">Aktuelles</a></li><li><a href=\\\"/kontakt/\\\">Kontakt</a></li></ul></nav>\\n<nav aria-label=\\\"Rechtliches\\\"><h2>Rechtliches</h2><ul><li><a href=\\\"/impressum/\\\">Impressum</a></li><li><a href=\\\"/datenschutz/\\\">Datenschutz</a></li></ul></nav>\\n    </div>\\n    <div class=\\\"site-footer__bottom\\\">\\n      <p>© <span data-current-year>2026</span> Living Charity e. V.</p>\\n      <p>Hilfe, die Menschen direkt erreicht.</p>\\n    </div>\\n  </div>\\n</footer>\\n\\n\\n\",\"title\":\"Über uns — Living Charity e. V. | Eingetragener Verein seit 2010\"},\"/unsere-arbeit/\":{\"body\":\"\\n<a class=\\\"skip-link\\\" href=\\\"#hauptinhalt\\\">Zum Inhalt springen</a>\\n<div class=\\\"trust-strip\\\">\\n  <strong>Eingetragener Verein seit 2010</strong> · Amtsgericht Köln · VR 16395\\n</div>\\n<header class=\\\"site-header\\\" data-header>\\n  <div class=\\\"container site-header__bar\\\">\\n    <a class=\\\"brand\\\" href=\\\"/\\\" aria-label=\\\"Living Charity e. V. — zur Startseite\\\">\\n      <svg class=\\\"brand__mark\\\" viewBox=\\\"0 0 40 40\\\" aria-hidden=\\\"true\\\" focusable=\\\"false\\\">\\n        <!-- Neutrale typografische Bildmarke (Platzhalter bis das echte\\n             Vereinslogo vorliegt — interner Status: confirmation-required) -->\\n        <rect width=\\\"40\\\" height=\\\"40\\\" rx=\\\"8\\\" fill=\\\"#f2f4ef\\\"/>\\n        <text x=\\\"20\\\" y=\\\"27\\\" text-anchor=\\\"middle\\\" font-family=\\\"Manrope, sans-serif\\\" font-size=\\\"17\\\" font-weight=\\\"800\\\" fill=\\\"#173f35\\\">LC</text>\\n        <rect x=\\\"8\\\" y=\\\"31\\\" width=\\\"24\\\" height=\\\"2.5\\\" rx=\\\"1.25\\\" fill=\\\"#b86548\\\"/>\\n      </svg>\\n      <span class=\\\"brand__name\\\">Living Charity\\n        <span class=\\\"brand__sub\\\">Eingetragener Verein · Bergneustadt</span>\\n      </span>\\n    </a>\\n    <button class=\\\"nav-toggle\\\" type=\\\"button\\\" aria-expanded=\\\"false\\\" aria-controls=\\\"hauptnavigation\\\" data-nav-toggle>\\n      <span class=\\\"visually-hidden\\\">Menü öffnen oder schließen</span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n    </button>\\n    <nav class=\\\"site-nav\\\" id=\\\"hauptnavigation\\\" aria-label=\\\"Hauptnavigation\\\" data-nav>\\n      <ul class=\\\"site-nav__list\\\">\\n        <li><a class=\\\"site-nav__link\\\" href=\\\"/unsere-arbeit/\\\" aria-current=\\\"page\\\">Unsere Arbeit</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/sri-lanka/\\\">Sri Lanka</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/projekte/\\\">Projekte</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/ueber-uns/\\\">Über uns</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/aktuelles/\\\">Aktuelles</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/kontakt/\\\">Kontakt</a></li>\\n        <li><a class=\\\"btn site-nav__cta\\\" href=\\\"/spenden/\\\">Jetzt helfen</a></li>\\n      </ul>\\n    </nav>\\n  </div>\\n</header>\\n\\n<main id=\\\"hauptinhalt\\\">\\n<div class=\\\"container\\\">\\n  <nav class=\\\"breadcrumbs\\\" aria-label=\\\"Sie sind hier\\\">\\n    <ol>\\n      <li><a href=\\\"/\\\">Startseite</a></li>\\n      <li><span aria-current=\\\"page\\\">Unsere Arbeit</span></li>\\n    </ol>\\n  </nav>\\n  <header class=\\\"page-head\\\">\\n    <p class=\\\"overline\\\">Unsere Arbeit</p>\\n    <h1>Aus Unterstützung wird konkrete Hilfe</h1>\\n    <p class=\\\"lead\\\">Living Charity möchte Menschen in schwierigen Lebenssituationen praktisch unterstützen, Solidarität fördern und Spenden möglichst direkt in konkrete Hilfsmaßnahmen überführen.</p>\\n  </header>\\n</div>\\n\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"split split--asym\\\">\\n      <div class=\\\"flow-lg reveal\\\">\\n        <div>\\n          <h2>Was wir tun</h2>\\n          <p>Living Charity e. V. ist ein seit 2010 eingetragener Verein mit Sitz in Bergneustadt. Der Verein sammelt Spenden und organisiert Unterstützung für Menschen in akuten Notlagen. Ein besonderer Schwerpunkt liegt auf Hilfsaktionen für Menschen in Sri Lanka.</p>\\n          <p>Unser Ziel ist es, Hilfsbedarf sichtbar zu machen, Unterstützer miteinander zu verbinden und verfügbare Mittel verantwortungsvoll für konkrete Maßnahmen einzusetzen.</p>\\n        </div>\\n        <div>\\n          <h2>Wie Hilfe abläuft</h2>\\n          <p>Von der Dokumentation eines Bedarfs bis zur Veröffentlichung des\\n          Fortschritts — den Ablauf, an dem wir uns ausrichten, zeigen wir\\n          Schritt für Schritt auf der <a href=\\\"/transparenz/\\\">Transparenzseite</a>.</p>\\n        </div>\\n        <div>\\n          <h2>Woran wir uns messen lassen</h2>\\n          <p>Vertrauen entsteht durch nachvollziehbare Hilfe. Deshalb sollen auf dieser Website Projekte, Ansprechpartner, Spendenwege und verfügbare Nachweise so klar wie möglich dargestellt werden.</p>\\n        </div>\\n      </div>\\n      <div class=\\\"flow reveal\\\">\\n        <figure class=\\\"doc-media\\\">\\n          <div class=\\\"doc-media__frame\\\">\\n            <div class=\\\"media-pending\\\">Originale Projektaufnahme wird ergänzt.</div>\\n          </div>\\n          <figcaption class=\\\"doc-media__caption\\\">\\n            <span>Vereinsarbeit, dokumentarisch</span>\\n            <span class=\\\"source-badge source-badge--illustration\\\">Platzhalter</span>\\n          </figcaption>\\n        </figure>\\n        <div class=\\\"info-card\\\">\\n          <h3>Zwei Wege zu helfen</h3>\\n          <p class=\\\"text-sm\\\"><a href=\\\"/sri-lanka/\\\">Sri-Lanka-Hilfe</a> — Unterstützung\\n          nach akuten Notlagen.<br>\\n          <a href=\\\"/plant-ceylon/\\\">Plant Ceylon</a> — langfristiges Baumprojekt\\n          mit persönlichem Nachweis.</p>\\n        </div>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section--sand section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Schwerpunkt</p>\\n      <h2>Sri Lanka im Fokus</h2>\\n      <p>Ein Schwerpunkt der aktuellen Arbeit liegt auf der Unterstützung von Menschen in Sri Lanka. Insbesondere nach Überschwemmungen und anderen akuten Notlagen werden Spenden für Lebensmittel und direkte Versorgungshilfe gesammelt.</p>\\n    </div>\\n    <div class=\\\"hero__actions reveal\\\">\\n      <a class=\\\"btn btn--accent\\\" href=\\\"/sri-lanka/\\\">Zur Sri-Lanka-Hilfe <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      <a class=\\\"btn btn--ghost\\\" href=\\\"/projekte/\\\">Alle Projekte</a>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section-forest cta-final\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"reveal\\\">\\n      <h2>Sie möchten mit anpacken?</h2>\\n      <p>Geld, Zeit, Können oder Reichweite — jede Form der Unterstützung zählt.</p>\\n    </div>\\n    <div class=\\\"cta-final__actions reveal\\\">\\n      <a class=\\\"btn btn--primary\\\" href=\\\"/spenden/\\\">Jetzt helfen <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      <a class=\\\"btn btn--ghost\\\" href=\\\"/kontakt/\\\">Kontakt aufnehmen</a>\\n    </div>\\n  </div>\\n</section>\\n</main>\\n<footer class=\\\"site-footer\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"site-footer__grid\\\">\\n      <div class=\\\"site-footer__brand\\\">\\n        <a class=\\\"brand\\\" href=\\\"/\\\">\\n          <svg class=\\\"brand__mark\\\" viewBox=\\\"0 0 40 40\\\" aria-hidden=\\\"true\\\" focusable=\\\"false\\\">\\n            <rect width=\\\"40\\\" height=\\\"40\\\" rx=\\\"8\\\" fill=\\\"#f2f4ef\\\" opacity=\\\"0.12\\\"/>\\n            <text x=\\\"20\\\" y=\\\"27\\\" text-anchor=\\\"middle\\\" font-family=\\\"Manrope, sans-serif\\\" font-size=\\\"17\\\" font-weight=\\\"800\\\" fill=\\\"#f2f4ef\\\">LC</text>\\n            <rect x=\\\"8\\\" y=\\\"31\\\" width=\\\"24\\\" height=\\\"2.5\\\" rx=\\\"1.25\\\" fill=\\\"#b86548\\\"/>\\n          </svg>\\n          <span class=\\\"brand__name\\\">Living Charity\\n            <span class=\\\"brand__sub\\\">Eingetragener Verein</span>\\n          </span>\\n        </a>\\n        <address style=\\\"margin-top:1.25rem\\\">\\n          Living Charity e. V.<br>\\n          Kölner Straße 64<br>\\n          51702 Bergneustadt<br>\\n          <a href=\\\"mailto:info@livingcharity.de\\\">info@livingcharity.de</a>\\n          <!-- Telefonzeile + Click-to-Call: aktivieren, sobald bestätigt\\n               (site.json → org.phone; interner Status: confirmation-required) -->\\n        </address>\\n        <p class=\\\"site-footer__register\\\">\\n          Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010\\n        </p>\\n        <!-- Social-Media-Icons erst mit verifizierten Profilen (org.socialLinks) -->\\n      </div>\\n      <nav aria-label=\\\"Der Verein\\\"><h2>Der Verein</h2><ul><li><a href=\\\"/unsere-arbeit/\\\">Unsere Arbeit</a></li><li><a href=\\\"/sri-lanka/\\\">Sri Lanka</a></li><li><a href=\\\"/projekte/\\\">Projekte</a></li><li><a href=\\\"/ueber-uns/\\\">Über uns</a></li><li><a href=\\\"/transparenz/\\\">Transparenz</a></li></ul></nav>\\n<nav aria-label=\\\"Helfen\\\"><h2>Helfen</h2><ul><li><a href=\\\"/spenden/\\\">Spenden</a></li><li><a href=\\\"/plant-ceylon/\\\">Plant Ceylon</a></li><li><a href=\\\"/aktuelles/\\\">Aktuelles</a></li><li><a href=\\\"/kontakt/\\\">Kontakt</a></li></ul></nav>\\n<nav aria-label=\\\"Rechtliches\\\"><h2>Rechtliches</h2><ul><li><a href=\\\"/impressum/\\\">Impressum</a></li><li><a href=\\\"/datenschutz/\\\">Datenschutz</a></li></ul></nav>\\n    </div>\\n    <div class=\\\"site-footer__bottom\\\">\\n      <p>© <span data-current-year>2026</span> Living Charity e. V.</p>\\n      <p>Hilfe, die Menschen direkt erreicht.</p>\\n    </div>\\n  </div>\\n</footer>\\n\\n\\n\",\"title\":\"Unsere Arbeit — Living Charity e. V.\"}};\nwindow.__LC_SEARCH_INDEX = [{\"path\":\"/aktuelles/\",\"title\":\"Aktuelles\",\"text\":\" Aktuelles — Living Charity e. V. Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Startseite Aktuelles Aktuelles Berichte aus der Vereinsarbeit Hier veröffentlichen wir Projekt-Updates, Rückblicke und Neuigkeiten — jeder Beitrag mit echtem Datum und klarer Kennzeichnung. Neue Einblicke und Projektberichte werden derzeit vorbereitet. Sobald Berichte, Bilder und Belege für die Veröffentlichung aufbereitet sind, erscheinen sie hier — mit echtem Datum und klarer Kennzeichnung. Fragen? Kontakt aufnehmen Nichts verpassen Solange es keinen Newsletter gibt, gilt: Schauen Sie hier vorbei oder schreiben Sie uns — wir informieren auf Wunsch persönlich, ohne automatische Verteiler. Kontakt aufnehmen → LC Living Charity Eingetragener Verein Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010 Der Verein Unsere Arbeit Sri Lanka Projekte Über uns Transparenz Helfen Spenden Plant Ceylon Aktuelles Kontakt Rechtliches Impressum Datenschutz © 2026 Living Charity e. V. Hilfe, die Menschen direkt erreicht. \"},{\"path\":\"/\",\"title\":\"Living Charity e. V.\",\"text\":\" Living Charity e. V. — Hilfe, die Menschen direkt erreicht Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Living Charity e.&nbsp;V. · Hilfe für Menschen in Not Hilfe, die Menschen direkt erreicht. Living Charity e.&nbsp;V. unterstützt Menschen in akuten Notlagen und verbindet Spenderinnen und Spender in Deutschland mit konkreter Hilfe in Sri Lanka. Für Sri Lanka spenden → Unsere Arbeit kennenlernen Eingetragener Verein seit 2010 Originale Projektaufnahme wird ergänzt. Dokumentarische Fotografie aus Sri Lanka — in Vorbereitung Platzhalter 5 € Ein Tag Nahrung — laut Spendenaufruf Schon ein kleiner Beitrag kann einen Tag Hilfe bedeuten. Nach Angaben des öffentlichen Spendenaufrufs von Dr. Umes Arunagirinathan kann bereits ein Beitrag von 5 Euro dabei helfen, eine Familie in Sri Lanka einen Tag lang mit Nahrung zu versorgen. Die tatsächliche Verwendung richtet sich nach dem aktuellen Bedarf und der jeweiligen Hilfsaktion. Externe Quelle Quelle und Spendenaufruf ansehen Seit 2010 engagiert Solidarität wird wirksam, wenn aus Unterstützung konkrete Hilfe entsteht. Living Charity e. V. ist ein seit 2010 eingetragener Verein mit Sitz in Bergneustadt. Der Verein sammelt Spenden und organisiert Unterstützung für Menschen in akuten Notlagen. Ein besonderer Schwerpunkt liegt auf Hilfsaktionen für Menschen in Sri Lanka. Unser Ziel ist es, Hilfsbedarf sichtbar zu machen, Unterstützer miteinander zu verbinden und verfügbare Mittel verantwortungsvoll für konkrete Maßnahmen einzusetzen. Auf einen Blick Eingetragener Verein seit dem 16. Juni 2010 Amtsgericht Köln · VR 16395 Sitz in Bergneustadt Direkt erreichbar: info@livingcharity.de Schwerpunkt Unterstützung für Menschen in Sri Lanka Überschwemmungen und andere akute Notlagen können Familien innerhalb kurzer Zeit die Grundlage ihres Alltags nehmen. Living Charity sammelt Unterstützung für Lebensmittel und notwendige Versorgung. Lebensmittelhilfe Grundversorgung für Familien, die durch eine akute Notlage ihre Lebensgrundlage verloren haben. Unterstützung nach akuten Notlagen Hilfe, die nach Überschwemmungen und anderen Ereignissen dort ansetzt, wo sie unmittelbar gebraucht wird. Mehr zur Sri-Lanka-Hilfe → Im Fokus Aktuelle Hilfsaktion Aktuelle Hilfsaktion wird dokumentiert Die vollständigen Informationen, Bilder und Nachweise werden derzeit für die Veröffentlichung vorbereitet. Fragen zur aktuellen Hilfsaktion → Langfristiges Projekt Einen Baum pflanzen. Wirkung sichtbar machen. Plant Ceylon verbindet die Pflanzung tropischer Bäume mit einem persönlichen Nachweis. Unterstützer wählen eine Baumart, die in Sri Lanka gepflanzt und mit einem Namen oder einer Widmung dokumentiert werden soll. Die genaue rechtliche und finanzielle Zuordnung des Projekts wird vor der Veröffentlichung transparent ergänzt. Plant Ceylon kennenlernen → Baum auswählen Wählen Sie eine tropische Pflanze für sich selbst oder als persönliches Geschenk. Pflanzung vor Ort Ein lokales Team wählt entsprechend der Baumart einen geeigneten Standort und bereitet die Pflanzung vor. Persönlichen Nachweis erhalten Nach der Pflanzung soll ein persönlicher Bild- oder Videonachweis mit Baum, Standort und gewünschtem Namen beziehungsweise einer Widmung übermittelt werden. Langfristig unterstützen Die Früchte der gepflanzten Bäume sollen langfristig Nahrung bereitstellen und Menschen beziehungsweise Gemeinschaften vor Ort unterstützen. Transparenz So soll Unterstützung nachvollziehbar werden Vertrauen entsteht durch nachvollziehbare Hilfe. Deshalb sollen auf dieser Website Projekte, Ansprechpartner, Spendenwege und verfügbare Nachweise so klar wie möglich dargestellt werden. Bedarf wird dokumentiert Ein Bedarf oder Projekt wird erfasst und beschrieben. Spenden werden zugeordnet Jede Unterstützung wird einem Hilfszweck zugeordnet. Hilfe wird organisiert Die\"},{\"path\":\"/kontakt/\",\"title\":\"Kontakt\",\"text\":\" Kontakt — Living Charity e. V. | Bergneustadt Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Startseite Kontakt Kontakt Fragen zu Projekten oder Spenden? Schreiben Sie uns — wir antworten persönlich und so schnell wir können. Nachricht senden Name Bitte geben Sie Ihren Namen an. E-Mail-Adresse Bitte geben Sie eine gültige E-Mail-Adresse an (z. B. name@beispiel.de). Telefon (optional) Nur, wenn Sie einen Rückruf möchten. Thema Bitte wählen … Spende Sri-Lanka-Hilfe Plant Ceylon Ehrenamtliche Unterstützung Kooperation Allgemeine Anfrage Bitte wählen Sie ein Thema aus. Ihre Nachricht Bitte schreiben Sie uns kurz Ihr Anliegen. Firma (bitte leer lassen) Ich habe die Datenschutzerklärung gelesen und bin damit einverstanden, dass meine Angaben zur Beantwortung meiner Anfrage verarbeitet werden. Die Einwilligung kann ich jederzeit widerrufen. Bitte bestätigen Sie die Datenschutzhinweise. Absenden → Ihre Daten werden nur zur Beantwortung Ihrer Anfrage verwendet und nicht weitergegeben. Direkt erreichen Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Standort &amp; Anfahrt Sie finden uns an der Kölner Straße 64 in 51702 Bergneustadt. Aus Datenschutzgründen laden wir keine externe Karte automatisch. Der Link öffnet OpenStreetMap in einem neuen Tab — dort gelten die Datenschutzbestimmungen von OpenStreetMap. Karte auf OpenStreetMap öffnen LC Living Charity Eingetragener Verein Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010 Der Verein Unsere Arbeit Sri Lanka Projekte Über uns Transparenz Helfen Spenden Plant Ceylon Aktuelles Kontakt Rechtliches Impressum Datenschutz © 2026 Living Charity e. V. Hilfe, die Menschen direkt erreicht. \"},{\"path\":\"/plant-ceylon/\",\"title\":\"Plant Ceylon\",\"text\":\" Plant Ceylon — Einen Baum pflanzen, Wirkung sichtbar machen Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Startseite Projekte Plant Ceylon Langfristiges Projekt · In Prüfung Einen Baum pflanzen. Wirkung sichtbar machen. Plant Ceylon verbindet die Pflanzung tropischer Bäume mit einem persönlichen Nachweis. Unterstützer wählen eine Baumart, die in Sri Lanka gepflanzt und mit einem Namen oder einer Widmung dokumentiert werden soll. So soll es ablaufen Baum auswählen Wählen Sie eine tropische Pflanze für sich selbst oder als persönliches Geschenk. Pflanzung vor Ort Ein lokales Team wählt entsprechend der Baumart einen geeigneten Standort und bereitet die Pflanzung vor. Persönlichen Nachweis erhalten Nach der Pflanzung soll ein persönlicher Bild- oder Videonachweis mit Baum, Standort und gewünschtem Namen beziehungsweise einer Widmung übermittelt werden. Langfristig unterstützen Die Früchte der gepflanzten Bäume sollen langfristig Nahrung bereitstellen und Menschen beziehungsweise Gemeinschaften vor Ort unterstützen. Der persönliche Nachweis wird nach erfolgter Pflanzung erstellt und in der Regel innerhalb von bis zu 14 Tagen übermittelt. Acht Baumarten zur Auswahl Kokospalme Derzeit 44 € Mangobaum Derzeit 44 € Bananenpflanze Derzeit 44 € Jackfruchtbaum Derzeit 44 € Papayapflanze Derzeit 44 € Ananaspflanze Derzeit 44 € Rambutanbaum Derzeit 44 € Mangostanbaum Derzeit 44 € Die genaue rechtliche und finanzielle Zuordnung des Projekts wird vor der Veröffentlichung transparent ergänzt. Externe Projektseite Plant Ceylon kennenlernen Einordnung Was die Beiträge bewirken sollen Nach Angaben des Projekts sollen die Beiträge für Pflanzung, Organisation, Dokumentation, Pflege und die Unterstützung beteiligter Menschen eingesetzt werden. Der Baum soll einem Namen oder einer Widmung zugeordnet werden; der Nachweis soll per WhatsApp oder E-Mail übermittelt werden können, auch anonyme Bestellungen sollen möglich sein. Diese Angaben sind Projektbeschreibungen des Betreibers. Die rechtliche und finanzielle Zuordnung — einschließlich der Frage, ob der Beitrag eine Spende oder ein Kaufpreis ist und ob eine Zuwendungsbestätigung möglich ist — wird vor der Veröffentlichung transparent ergänzt. Originalaufnahme Pflanz-Dokumentation Unbearbeitete Fotos und Videos der Pflanzflächen mit Ort und Datum — werden ergänzt, sobald verifiziertes Material vorliegt. Projektbericht Regelmäßige Updates Fortschritte, Pflege und Wirkung der Pflanzungen — in Vorbereitung. Illustration Bildmaterial in Prüfung Bis verifizierte Originalaufnahmen vorliegen, verzichtet diese Seite bewusst auf Projektfotos. Fragen zu Plant Ceylon? Wir beantworten sie gern — auch zur geplanten Zuordnung des Projekts. Kontakt aufnehmen → Zur Projektseite LC Living Charity Eingetragener Verein Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010 Der Verein Unsere Arbeit Sri Lanka Projekte Über uns Transparenz Helfen Spenden Plant Ceylon Aktuelles Kontakt Rechtliches Impressum Datenschutz © 2026 Living Charity e. V. Hilfe, die Menschen direkt erreicht. \"},{\"path\":\"/projekte/\",\"title\":\"Projekte & Spendenzwecke\",\"text\":\" Projekte &amp; Spendenzwecke — Living Charity e. V. Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Startseite Projekte Projekte &amp; Spendenzwecke Woran wir arbeiten Jedes Projekt bekommt Ort, Ziel, Status und — sobald verfügbar — dokumentierte Nachweise. Wir zeigen nur, was wir belegen können, und kennzeichnen, was sich noch in Vorbereitung oder Prüfung befindet. Unsere Projekte Originale Projektaufnahme wird ergänzt. Aktiv Sri Lanka Sri-Lanka-Hilfe Unterstützung für Menschen nach Überschwemmungen und akuten Notlagen — Lebensmittel und direkte Versorgungshilfe. Zur Sri-Lanka-Hilfe → Verifiziertes Bildmaterial in Prüfung. In Prüfung Sri Lanka Plant Ceylon Tropische Bäume pflanzen, persönlich dokumentiert — die rechtliche Zuordnung des Projekts wird transparent ergänzt. Zum Baumprojekt → Aktuelle Hilfsaktion wird dokumentiert Die vollständigen Informationen, Bilder und Nachweise werden derzeit für die Veröffentlichung vorbereitet. Fragen zur aktuellen Hilfsaktion → So lesen Sie unsere Projektseiten Ein Status, der etwas bedeutet Jedes Projekt trägt genau einen Status — so sehen Sie sofort, wo Ihre Unterstützung gerade wirkt. Geplant — Vorbereitung läuft, Unterstützung wird gesammelt. Aktiv — die Maßnahme wird gerade umgesetzt. Laufende Unterstützung — dauerhafte Hilfe ohne festes Enddatum. Abgeschlossen — Ziel erreicht, mit Abschlussbericht. In Prüfung — Darstellung folgt, sobald Angaben verifiziert sind. Sie möchten ein Projekt unterstützen? Allgemein oder gezielt — beides ist möglich. Jetzt unterstützen → Frage stellen LC Living Charity Eingetragener Verein Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010 Der Verein Unsere Arbeit Sri Lanka Projekte Über uns Transparenz Helfen Spenden Plant Ceylon Aktuelles Kontakt Rechtliches Impressum Datenschutz © 2026 Living Charity e. V. Hilfe, die Menschen direkt erreicht. \"},{\"path\":\"/spenden/\",\"title\":\"Spenden\",\"text\":\" Spenden — Living Charity e. V. | Ihre Unterstützung kann direkt helfen Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Startseite Spenden Spenden &amp; Unterstützung Ihre Unterstützung kann direkt helfen. Jeder Beitrag kann dazu beitragen, Lebensmittel, Versorgung und konkrete Hilfsmaßnahmen für Menschen in Sri Lanka zu ermöglichen. 5 € Ein Tag Nahrung — laut Spendenaufruf Schon ein kleiner Beitrag kann einen Tag Hilfe bedeuten. Nach Angaben des öffentlichen Spendenaufrufs von Dr. Umes Arunagirinathan kann bereits ein Beitrag von 5 Euro dabei helfen, eine Familie in Sri Lanka einen Tag lang mit Nahrung zu versorgen. Die tatsächliche Verwendung richtet sich nach dem aktuellen Bedarf und der jeweiligen Hilfsaktion. Externe Quelle Quelle und Spendenaufruf ansehen Spenden per Überweisung Wählen Sie einen Betrag als Orientierung — überwiesen wird ganz normal über Ihre Bank. 5 € 10 € 25 € 50 € Freier Betrag Empfänger Living Charity e. V. IBAN DE18 3845 0000 1000 2149 63 BIC WELADED1GMB Bank Sparkasse Gummersbach-Bergneustadt Verwendungszweck Spende Living Charity IBAN kopieren Kopiert ✓ BIC kopieren Kopiert ✓ QR-Überweisung (Girocode) folgt nach Bestätigung der Bankverbindung Informationen zur Ausstellung einer Spendenbescheinigung erhalten Sie auf Anfrage über info@livingcharity.de. Allgemein oder gezielt? Allgemeine Spende: Der Verein setzt sie dort ein, wo sie am dringendsten gebraucht wird — Verwendungszweck „Spende Living Charity\\\". Sri-Lanka-Hilfe: Ergänzen Sie den Verwendungszweck um „Sri Lanka\\\", wenn Ihre Spende der aktuellen Hilfe zugutekommen soll. Plant Ceylon: Das Baumprojekt hat eine eigene Projektseite mit allen Details. Spendenbescheinigung Informationen zur Ausstellung einer Spendenbescheinigung erhalten Sie auf Anfrage über info@livingcharity.de. Was mit Ihrer Spende passiert Den Ablauf, an dem wir uns ausrichten, zeigen wir auf der Transparenzseite ; Fortschritte veröffentlichen wir unter Aktuelles . Fragen zur Spende? Schreiben Sie an info@livingcharity.de oder nutzen Sie das Kontaktformular — wir antworten persönlich. Gut zu wissen Häufige Fragen zum Spenden Ist meine Spende sicher? Die Überweisung läuft direkt über Ihre Bank auf das Vereinskonto bei der Sparkasse Gummersbach-Bergneustadt — ohne Zwischenhändler. Diese Website verarbeitet bei einer Überweisung keine Daten von Ihnen. Kann ich online mit Karte oder PayPal spenden? Derzeit nicht — wir verzichten bewusst auf die Darstellung von Zahlungswegen, die noch nicht eingerichtet sind. Sobald ein Spendendienst geprüft und eingerichtet ist, finden Sie ihn hier mit allen Angaben zu Anbieter, Datenschutz und möglichen Gebühren. Wie erfahre ich, was meine Spende bewirkt hat? Über die Projektseiten und den Bereich Aktuelles . Dort dokumentieren wir Fortschritte mit Bildern, Berichten und Belegen, sobald sie vorliegen. Kann ich auch anders helfen als mit Geld? Ja — mit Zeit, Können, Sachspenden oder als Unternehmen. Sprechen Sie uns über das Kontaktformular an. Lieber erst den Verein kennenlernen? Verständlich. Schauen Sie sich an, wer wir sind und woran wir arbeiten. Über Living Charity → Unsere Arbeit LC Living Charity Eingetragener Verein Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010 Der Verein Unsere Arbeit Sri Lanka Projekte Über uns Transparenz Helfen Spenden Plant Ceylon Aktuelles Kontakt Rechtliches Impressum Datenschutz © 2026 Living Charity e. V. Hilfe, die Menschen direkt erreicht. \"},{\"path\":\"/sri-lanka/\",\"title\":\"Sri-Lanka-Hilfe\",\"text\":\" Sri-Lanka-Hilfe — Living Charity e. V. Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Startseite Sri Lanka Schwerpunkt Sri Lanka Unterstützung für Menschen in Sri Lanka Überschwemmungen und andere akute Notlagen können Familien innerhalb kurzer Zeit die Grundlage ihres Alltags nehmen. Living Charity sammelt Unterstützung für Lebensmittel und notwendige Versorgung. 5 € Ein Tag Nahrung — laut Spendenaufruf Schon ein kleiner Beitrag kann einen Tag Hilfe bedeuten. Nach Angaben des öffentlichen Spendenaufrufs von Dr. Umes Arunagirinathan kann bereits ein Beitrag von 5 Euro dabei helfen, eine Familie in Sri Lanka einen Tag lang mit Nahrung zu versorgen. Die tatsächliche Verwendung richtet sich nach dem aktuellen Bedarf und der jeweiligen Hilfsaktion. Externe Quelle Quelle und Spendenaufruf ansehen Der öffentliche Spendenaufruf Der Arzt und Autor Dr. Umes Arunagirinathan hat öffentlich zur Unterstützung der Flutopfer in Sri Lanka aufgerufen. Er kam selbst als Flüchtlingskind aus Sri Lanka nach Deutschland, kennt die genannten Vereine persönlich und nennt Living Charity als eine der Spendenmöglichkeiten. Nach seiner Aussage sollen die Spenden direkt bei den Betroffenen ankommen. Externe Quelle Öffentlichen Spendenaufruf ansehen Wofür gesammelt wird Lebensmittelhilfe: Grundversorgung für Familien, die durch eine akute Notlage ihre Lebensgrundlage verloren haben. Unterstützung nach akuten Notlagen: Hilfe, die nach Überschwemmungen und anderen Ereignissen unmittelbar ansetzt. Originale Projektaufnahme wird ergänzt. Dokumentation der Sri-Lanka-Hilfe — in Vorbereitung Platzhalter Direkt unterstützen Per Überweisung an das Vereinskonto — alle Angaben und Kopierknöpfe finden Sie auf der Spendenseite. Für Sri Lanka spenden → Langfristig Plant Ceylon: Bäume für Sri Lanka Neben der akuten Hilfe gibt es mit Plant Ceylon ein langfristiges Baumprojekt mit persönlichem Nachweis. Plant Ceylon kennenlernen → Jede Unterstützung hilft weiter Fragen zur Sri-Lanka-Hilfe beantworten wir persönlich. Jetzt spenden → Frage stellen LC Living Charity Eingetragener Verein Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010 Der Verein Unsere Arbeit Sri Lanka Projekte Über uns Transparenz Helfen Spenden Plant Ceylon Aktuelles Kontakt Rechtliches Impressum Datenschutz © 2026 Living Charity e. V. Hilfe, die Menschen direkt erreicht. \"},{\"path\":\"/transparenz/\",\"title\":\"Transparenz\",\"text\":\" Transparenz — Living Charity e. V. Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Startseite Transparenz Transparenz Nachvollziehbare Hilfe als Anspruch Vertrauen entsteht durch nachvollziehbare Hilfe. Deshalb sollen auf dieser Website Projekte, Ansprechpartner, Spendenwege und verfügbare Nachweise so klar wie möglich dargestellt werden. So soll Unterstützung nachvollziehbar werden Bedarf wird dokumentiert Ein Bedarf oder Projekt wird erfasst und beschrieben. Spenden werden zugeordnet Jede Unterstützung wird einem Hilfszweck zugeordnet. Hilfe wird organisiert Die Unterstützung wird vor Ort organisiert. Belege werden gesammelt Bilder, Berichte und Belege werden zusammengetragen. Fortschritte werden veröffentlicht Der Stand wird auf dieser Website dokumentiert. Wie wir mit Nachweisen umgehen Jede Aussage auf dieser Website soll einordbar sein. Dafür unterscheiden wir sichtbar: Originalaufnahme — unbearbeitetes Material mit Ort und Datum. Projektbericht — Berichte des Vereins über Fortschritt und Mittelverwendung. Externe Quelle — zitierte Aussagen Dritter, stets verlinkt. Illustration — erkennbar keine Beweisfotografie. Zahlen veröffentlichen wir nur mit Quelle, Zeitraum und Zählweise. Wo Angaben noch geprüft werden — etwa die rechtliche Zuordnung von Plant Ceylon — kennzeichnen wir das offen als „in Prüfung\\\". Registerdaten Öffentlich überprüfbar Living Charity e. V. ist seit dem 16. Juni 2010 beim Amtsgericht Köln unter VR 16395 eingetragen. Diese Angaben können Sie jederzeit im Vereinsregister prüfen. Vorstand &amp; Verein Berichte lesen Noch Fragen zur Mittelverwendung? Stellen Sie sie uns direkt — wir antworten persönlich. Kontakt aufnehmen → Jetzt helfen LC Living Charity Eingetragener Verein Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010 Der Verein Unsere Arbeit Sri Lanka Projekte Über uns Transparenz Helfen Spenden Plant Ceylon Aktuelles Kontakt Rechtliches Impressum Datenschutz © 2026 Living Charity e. V. Hilfe, die Menschen direkt erreicht. \"},{\"path\":\"/ueber-uns/\",\"title\":\"Über uns\",\"text\":\" Über uns — Living Charity e. V. | Eingetragener Verein seit 2010 Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Startseite Über uns Über uns Ein Verein, der ansprechbar ist Living Charity e.&nbsp;V. ist seit dem 16. Juni 2010 beim Amtsgericht Köln eingetragen (VR 16395) und in Bergneustadt zu Hause. Hier finden Sie die Menschen, die Fakten und die Haltung hinter unserer Hilfe. Unser Auftrag Wofür es uns gibt Living Charity e. V. ist ein seit 2010 eingetragener Verein mit Sitz in Bergneustadt. Der Verein sammelt Spenden und organisiert Unterstützung für Menschen in akuten Notlagen. Ein besonderer Schwerpunkt liegt auf Hilfsaktionen für Menschen in Sri Lanka. Living Charity möchte Menschen in schwierigen Lebenssituationen praktisch unterstützen, Solidarität fördern und Spenden möglichst direkt in konkrete Hilfsmaßnahmen überführen. Unser Schwerpunkt Ein Schwerpunkt der aktuellen Arbeit liegt auf der Unterstützung von Menschen in Sri Lanka. Insbesondere nach Überschwemmungen und anderen akuten Notlagen werden Spenden für Lebensmittel und direkte Versorgungshilfe gesammelt. Zur Sri-Lanka-Hilfe → Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Rechtsform: Eingetragener Verein Registergericht: Amtsgericht Köln Registernummer: VR 16395 Eingetragen seit: 16. Juni 2010 Diese Angaben können Sie jederzeit mit dem Vereinsregister abgleichen. Vorstand Menschen hinter Living Charity NS Navaratnam Sivananthan Vorsitzender OT Ordin Thanapalasingham Schatzmeister SS Seevaratnam Sathianandan Schriftführer Häufige Fragen Woran Sie uns messen können Wie erfahre ich, was mit meiner Spende passiert? Über die Projektseiten und Aktuelles . Den Ablauf, an dem wir uns ausrichten, beschreibt die Transparenzseite . Erhalte ich eine Spendenbescheinigung? Informationen zur Ausstellung einer Spendenbescheinigung erhalten Sie auf Anfrage über info@livingcharity.de. Kann ich den Verein persönlich erreichen? Ja. Schreiben Sie an info@livingcharity.de oder nutzen Sie das Kontaktformular . Lernen Sie unsere Arbeit kennen Am besten versteht man einen Verein über das, was er tut. Unsere Arbeit → Kontakt aufnehmen LC Living Charity Eingetragener Verein Living Charity e. V. Kölner Straße 64 51702 Bergneustadt info@livingcharity.de Eingetragen beim Amtsgericht Köln · VR 16395 · seit 16. Juni 2010 Der Verein Unsere Arbeit Sri Lanka Projekte Über uns Transparenz Helfen Spenden Plant Ceylon Aktuelles Kontakt Rechtliches Impressum Datenschutz © 2026 Living Charity e. V. Hilfe, die Menschen direkt erreicht. \"},{\"path\":\"/unsere-arbeit/\",\"title\":\"Unsere Arbeit\",\"text\":\" Unsere Arbeit — Living Charity e. V. Zum Inhalt springen Eingetragener Verein seit 2010 · Amtsgericht Köln · VR 16395 LC Living Charity Eingetragener Verein · Bergneustadt Menü öffnen oder schließen Unsere Arbeit Sri Lanka Projekte Über uns Aktuelles Kontakt Jetzt helfen Startseite Unsere Arbeit Unsere Arbeit Aus Unterstützung wird konkrete Hilfe Living Charity möchte Menschen in schwierigen Lebenssituationen praktisch unterstützen, Solidarität fördern und Spenden möglichst direkt in konkrete Hilfsmaßnahmen überführen. Was wir tun Living Charity e. V. ist ein seit 2010 eingetragener Verein mit Sitz in Bergneustadt. Der Verein sammelt Spenden und organisiert Unterstützung für Menschen in akuten Notlagen. Ein besonderer Schwerpunkt liegt auf Hilfsaktionen für Menschen in Sri Lanka. Unser Ziel ist es, Hilfsbedarf sichtbar zu machen, Unterstützer miteinander zu verbinden und verfügbare Mittel verantwortungsvoll für konkrete Maßnahmen einzusetzen. Wie Hilfe abläuft Von der Dokumentation eines Bedarfs bis zur Veröffentlichung des Fortschritts — den Ablauf, an dem wir uns ausrichten, zeigen wir Schritt für Schritt auf der Transparenzseite . Woran wir uns messen lassen Vertrauen entsteht durch nachvollziehbare Hilfe. Deshalb sollen auf dieser Website Projekte, Ansprechpartner, Spendenwege und verfügbare Nachweise so klar wie möglich dargestellt werden. Originale Projektaufnahme wird ergänzt. Vereinsarbeit, dokumentarisch Platzhalter Zwei Wege zu helfen Sri-Lanka-Hilfe — Unterstützung nach akuten Notlagen. Plant Ceylon — langfristiges Baumprojekt mit persönlichem Nachweis. Schwerpunkt Sri Lanka       toggle.setAttribute(\\\"aria-expanded\\\", \\\"false\\\");\\n        toggle.focus();\\n      }\\n    });\\n  }\\n\\n  /* ---------- Reveal-Animationen (respektiert prefers-reduced-motion) ---------- */\\n  var reduceMotion = window.matchMedia(\\\"(prefers-reduced-motion: reduce)\\\").matches;\\n  var revealEls = document.querySelectorAll(\\\".reveal\\\");\\n  if (!reduceMotion && \\\"IntersectionObserver\\\" in window && revealEls.length) {\\n    document.querySelectorAll(\\\".reveal-stagger\\\").forEach(function (group) {\\n      Array.prototype.forEach.call(group.children, function (child, i) {\\n        child.style.setProperty(\\\"--stagger-i\\\", String(i % 6));\\n      });\\n    });\\n    var io = new IntersectionObserver(\\n      function (entries) {\\n        entries.forEach(function (entry) {\\n          if (entry.isIntersecting) {\\n            entry.target.classList.add(\\\"is-visible\\\");\\n            io.unobserve(entry.target);\\n          }\\n        });\\n      },\\n      { rootMargin: \\\"0px 0px -8% 0px\\\", threshold: 0.1 }\\n    );\\n    revealEls.forEach(function (el) { io.observe(el); });\\n  } else {\\n    revealEls.forEach(function (el) { el.classList.add(\\\"is-visible\\\"); });\\n  }\\n\\n  /* ---------- Projektfortschritt (nur mit echten Daten befüllt) ---------- */\\n  document.querySelectorAll(\\\".progress[data-progress]\\\").forEach(function (el) {\\n    var val = Math.max(0, Math.min(100, parseFloat(el.getAttribute(\\\"data-progress\\\")) || 0));\\n    var bar = el.querySelector(\\\".progress__bar\\\");\\n    if (bar) {\\n      requestAnimationFrame(function () {\\n        el.style.setProperty(\\\"--progress\\\", val + \\\"%\\\");\\n        bar.style.width = val + \\\"%\\\";\\n      });\\n    }\\n  });\\n\\n  /* ---------- Kopierknöpfe (IBAN, BIC) ---------- */\\n  document.querySelectorAll(\\\"[data-copy-plain]\\\").forEach(function (btn) {\\n    btn.addEventListener(\\\"click\\\", function () {\\n      var value = btn.getAttribute(\\\"data-copy-plain\\\");\\n      var done = function () {\\n        btn.classList.add(\\\"is-copied\\\");\\n        window.setTimeout(function () { btn.classList.remove(\\\"is-copied\\\"); }, 2200);\\n      };\\n      if (navigator.clipboard && navigator.clipboard.writeText) {\\n        navigator.clipboard.writeText(value).then(done, done);\\n      } else {\\n        var target = document.getElementById(btn.getAttribute(\\\"data-copy-target\\\"));\\n        if (target && window.getSelection) {\\n          var range = document.createRange();\\n          range.selectNodeContents(target);\\n          var sel = window.getSelection();\\n          sel.removeAllRanges();\\n          sel.addRange(range);\\n        }\\n        done();\\n      }\\n    });\\n  });\\n\\n  /* ---------- Betragsauswahl (Orientierung für die Überweisung) ---------- */\\n  document.querySelectorAll(\\\".amount-picker\\\").forEach(function (picker) {\\n    picker.addEventListener(\\\"click\\\", function (e) {\\n      var btn = e.target.closest(\\\"button\\\");\\n      if (!btn) return;\\n      picker.querySelectorAll(\\\"button\\\").forEach(function (b) { b.setAttribute(\\\"aria-pressed\\\", \\\"false\\\"); });\\n      btn.setAttribute(\\\"aria-pressed\\\", \\\"true\\\");\\n      var purpose = document.getElementById(\\\"purpose-value\\\");\\n      if (purpose) {\\n        var amount = btn.getAttribute(\\\"data-amount\\\");\\n        purpose.textContent = amount === \\\"frei\\\"\\n          ? \\\"Spende Living Charity\\\"\\n          : \\\"Spende Living Charity — Orientierungsbetrag \\\" + amount + \\\" €\\\";\\n      }\\n    });\\n  });\\n\\n  /* ---------- Kontaktformular ----------\\n     Serverseitige Validierung ist zusätzlich zwingend — siehe docs/migration-guide.md. */\\n  var form = document.querySelector(\\\"[data-contact-form]\\\");\\n  if (form) {\\n    // Thema aus URL vorbelegen (?thema=… / ?anliegen=…)\\n    try {\\n      var params = new URLSearchParams(location.search);\\n      var topic = params.get(\\\"thema\\\") || params.get(\\\"anliegen\\\");\\n      var select = form.querySelector(\\\"select[name=thema]\\\");\\n      if (topic && select && select.querySelector('option[value=\\\"' + topic + '\\\"]')) select.value = topic;\\n    } catch (e) {}\\n\\n    var status = form.querySelector(\\\".form__status\\\");\\n    var setError = function (field, hasError) {\\n      var wrap = field.closest(\\\".field, .checkbox-field\\\");\\n      if (wrap) wrap.classList.toggle(\\\"has-error\\\", hasError);\\n      field.setAttribute(\\\"aria-invalid\\\", hasError ? \\\"true\\\" : \\\"false\\\");\\n    };\\n    form.addEventListener(\\\"submit\\\", function (e) {\\n      var invalid = [];\\n      form.querySelectorAll(\\\"[required]\\\").forEach(function (field) {\\n        var ok = field.type === \\\"checkbox\\\" ? field.checked : field.value.trim() !== \\\"\\\";\\n        if (ok && field.type === \\\"email\\\") {\\n          ok = /^[^\\\\s@]+@[^\\\\s@]+\\\\.[^\\\\s@]+$/.test(field.value.trim());\\n        }\\n        setError(field, !ok);\\n        if (!ok) invalid.push(field);\\n      });\\n      var hp = form.querySelector(\\\".hp-field input\\\");\\n      if (hp && hp.value !== \\\"\\\") { e.preventDefault(); return; }\\n\\n      if (invalid.length) {\\n        e.preventDefault();\\n        invalid[0].focus();\\n        if (status) {\\n          status.className = \\\"form__status is-error\\\";\\n          status.textContent = \\\"Bitte prüfen Sie die markierten Felder — es fehlen noch Angaben.\\\";\\n        }\\n        return;\\n      }\\n      // Vorabversion: kein Backend. Ehrlich melden und zur Danke-Logik der\\n      // späteren WordPress-Integration (Weiterleitung auf /danke/) überleiten.\\n      if (form.getAttribute(\\\"data-endpoint\\\") === \\\"none\\\") {\\n        e.preventDefault();\\n        window.location.href = \\\"/danke/\\\";\\n      }\\n    });\\n    form.addEventListener(\\\"input\\\", function (e) {\\n      if (e.target.matches(\\\"[required]\\\")) setError(e.target, false);\\n    });\\n  }\\n\\n  /* ---------- Suche (clientseitig über generierten Index) ---------- */\\n  var searchForm = document.querySelector(\\\"[data-search]\\\");\\n  if (searchForm) {\\n    var resultsEl = document.getElementById(\\\"suchergebnisse\\\");\\n    var statusEl = document.getElementById(\\\"suchstatus\\\");\\n    var runSearch = function (index, q) {\\n      var query = q.trim().toLowerCase();\\n      resultsEl.innerHTML = \\\"\\\";\\n      if (query.length < 2) {\\n        statusEl.textContent = \\\"Bitte mindestens zwei Zeichen eingeben.\\\";\\n        return;\\n      }\\n      var hits = index.filter(function (p) {\\n        return (p.title + \\\" \\\" + p.text).toLowerCase().indexOf(query) !== -1;\\n      });\\n      statusEl.textContent = hits.length\\n        ? hits.length + \\\" Treffer für „\\\" + q.trim() + \\\"“\\\"\\n        : \\\"Keine Treffer für „\\\" + q.trim() + \\\"“. Versuchen Sie einen anderen Begriff oder nutzen Sie die Navigation.\\\";\\n      hits.forEach(function (p) {\\n        var pos = p.text.toLowerCase().indexOf(query);\\n        var excerpt = pos > -1 ? \\\"… \\\" + p.text.slice(Math.max(0, pos - 60), pos + 120) + \\\" …\\\" : \\\"\\\";\\n        var li = document.createElement(\\\"li\\\");\\n        li.innerHTML = '<a href=\\\"' + p.path + '\\\"></a><p class=\\\"text-sm text-muted\\\"></p>';\\n        li.querySelector(\\\"a\\\").textContent = p.title;\\n        li.querySelector(\\\"p\\\").textContent = excerpt;\\n        resultsEl.appendChild(li);\\n      });\\n    };\\n    var withIndex = function (cb) {\\n      if (window.__LC_SEARCH_INDEX) { cb(window.__LC_SEARCH_INDEX); return; }\\n      fetch(\\\"/assets/search-index.json\\\")\\n        .then(function (r) { return r.json(); })\\n        .then(cb)\\n        .catch(function () {\\n          statusEl.textContent = \\\"Die Suche ist gerade nicht verfügbar. Bitte nutzen Sie die Navigation oder schreiben Sie uns.\\\";\\n        });\\n    };\\n    searchForm.addEventListener(\\\"submit\\\", function (e) {\\n      e.preventDefault();\\n      var q = searchForm.querySelector(\\\"input[name=q]\\\").value;\\n      withIndex(function (index) { runSearch(index, q); });\\n    });\\n    // Direktaufruf mit ?q=\\n    try {\\n      var q0 = new URLSearchParams(location.search).get(\\\"q\\\");\\n      if (q0) {\\n        searchForm.querySelector(\\\"input[name=q]\\\").value = q0;\\n        withIndex(function (index) { runSearch(index, q0); });\\n      }\\n    } catch (e) {}\\n  }\\n\\n  /* ---------- Aktuelles Jahr im Footer ---------- */\\n  document.querySelectorAll(\\\"[data-current-year]\\\").forEach(function (el) {\\n    el.textContent = String(new Date().getFullYear());\\n  });\\n})();\\n\";\nfunction render(route) {\n  if (!PAGES[route]) route = \"/404.html\";\n  document.getElementById(\"app\").innerHTML = PAGES[route].body;\n  document.title = PAGES[route].title;\n  window.scrollTo(0, 0);\n  try { new Function(MAIN_JS)(); } catch (e) {}\n  parent.postMessage({ lcRoute: route }, \"*\");\n}\ndocument.addEventListener(\"click\", function (e) {\n  var a = e.target.closest ? e.target.closest(\"a\") : null;\n  if (!a) return;\n  var href = a.getAttribute(\"href\") || \"\";\n  if (href.startsWith(\"mailto:\") || href.startsWith(\"tel:\") || a.target === \"_blank\") return;\n  if (href.startsWith(\"http\")) return;\n  e.preventDefault();\n  var route = href.split(\"?\")[0].split(\"#\")[0];\n  var hash = href.indexOf(\"#\") > -1 ? href.slice(href.indexOf(\"#\")) : \"\";\n  if (route === \"\" || route === \"#\") route = location.__lcRoute || \"/\";\n  render(route || \"/\");\n  if (hash) { var t = document.querySelector(hash); if (t) t.scrollIntoView(); }\n});\nwindow.addEventListener(\"message\", function (e) {\n  if (e.data && e.data.lcGoto) render(e.data.lcGoto);\n});\nrender(\"/\");\n<\/script></body></html>";
