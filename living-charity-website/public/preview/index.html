word; }\n\n.lead {\n  font-size: var(--text-lg);\n  line-height: 1.5;\n  color: var(--color-text);\n}\n\nsmall, .text-sm { font-size: var(--text-sm); }\n.text-muted { color: var(--color-text-muted); }\n\n/* Overline-Label: kleines, gesperrtes Etikett mit kurzer Linie */\n.overline {\n  display: flex;\n  align-items: center;\n  gap: 0.75rem;\n  font-size: var(--text-xs);\n  font-weight: 600;\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--color-primary);\n}\n.overline::before {\n  content: \"\";\n  width: 2rem;\n  height: 2px;\n  background: var(--color-accent);\n  flex: none;\n}\n.section-dark .overline { color: var(--color-text-invert); }\n\na {\n  color: var(--color-primary);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 0.2em;\n  transition: color var(--duration-quick) var(--ease-out);\n}\na:hover { color: var(--color-primary-dark); }\n\n::selection { background: var(--color-primary-light); color: var(--color-primary-dark); }\n\n/* ---------- Fokus & Tastatur ---------- */\n\n:focus-visible {\n  outline: var(--focus-ring);\n  outline-offset: 2px;\n  border-radius: 2px;\n}\n\n.skip-link {\n  position: absolute;\n  left: 1rem;\n  top: -4rem;\n  z-index: 100;\n  padding: 0.75rem 1.25rem;\n  background: var(--color-primary-dark);\n  color: var(--color-text-invert);\n  border-radius: var(--radius-sm);\n  text-decoration: none;\n  transition: top var(--duration-quick) var(--ease-out);\n}\n.skip-link:focus-visible { top: 1rem; color: var(--color-text-invert); }\n\n.visually-hidden {\n  position: absolute !important;\n  width: 1px; height: 1px;\n  margin: -1px; padding: 0; border: 0;\n  clip-path: inset(50%);\n  overflow: hidden;\n  white-space: nowrap;\n}\n\n/* ---------- Layout-Primitive ---------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container-max);\n  margin-inline: auto;\n  padding-inline: var(--container-pad);\n}\n.container--wide { max-width: var(--container-wide); }\n.container--text { max-width: calc(var(--container-text) + 2 * var(--container-pad)); }\n\n.section { padding-block: var(--space-section); }\n.section--sm { padding-block: var(--space-section-sm); }\n.section--tinted { background: var(--color-surface-deep); }\n.section-dark {\n  background: var(--color-ink);\n  color: var(--color-text-invert);\n}\n.section-dark :is(h1, h2, h3, h4) { color: var(--color-text-invert); }\n.section-dark p { line-height: calc(var(--leading-body) + 0.07); } /* helle Schrift braucht mehr Luft */\n.section-dark a { color: #b8d8cc; }\n.section-dark a:hover { color: var(--color-text-invert); }\n\n.section-head { margin-bottom: var(--space-7); max-width: 52rem; }\n.section-head .overline { margin-bottom: var(--space-4); }\n.section-head p { margin-top: var(--space-4); }\n\n.grid { display: grid; gap: var(--space-6); }\n.grid--cards { grid-template-columns: repeat(auto-fit, minmax(min(18rem, 100%), 1fr)); }\n.grid--halves { grid-template-columns: repeat(auto-fit, minmax(min(22rem, 100%), 1fr)); align-items: center; }\n\n.flow > * + * { margin-top: var(--space-4); }\n.flow-lg > * + * { margin-top: var(--space-6); }\n\nhr.rule {\n  border: 0;\n  border-top: 1px solid var(--color-border);\n  margin-block: var(--space-7);\n}\n\n/* ---------- Interne Inhalts-Marker (nur Vorabversion) ---------- */\n\n.content-todo {\n  display: inline-block;\n  padding: 0.15em 0.6em;\n  border: 1.5px dashed var(--color-warning);\n  border-radius: var(--radius-sm);\n  background: #fdf6e3;\n  color: var(--color-warning);\n  font-family: var(--font-text);\n  font-size: var(--text-xs);\n  font-weight: 600;\n  letter-spacing: 0.02em;\n  line-height: 1.5;\n  vertical-align: middle;\n}\n.content-todo::before { content: \"⚠ intern · \"; }\n\n/* Blockvariante für ganze fehlende Inhaltsbereiche */\n.content-todo-block {\n  padding: var(--space-5);\n  border: 1.5px dashed var(--color-warning);\n  border-radius: var(--radius-md);\n  background: #fdf6e3;\n  color: #6d4a05;\n  font-size: var(--text-sm);\n  max-width: none;\n}\n.content-todo-block strong { display: block; margin-bottom: 0.35em; color: var(--color-warning); }\n\n/* ---------- Reveal-Animationen (dezent, abschaltbar) ---------- */\n\n.reveal {\n  opacity: 0;\n  transform: translateY(14px);\n  transition:\n    opacity var(--duration-reveal) var(--ease-out),\n    transform var(--duration-reveal) var(--ease-out);\n}\n.reveal.is-visible { opacity: 1; transform: none; }\n.reveal-stagger > * { transition-delay: calc(var(--stagger-i, 0) * 70ms); }\n\n/* Ohne JavaScript und bei reduzierter Bewegung: alles sofort sichtbar */\n.no-js .reveal { opacity: 1; transform: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  .reveal { opacity: 1; transform: none; transition: none; }\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n/* ---------- Druck ---------- */\n@media print {\n  .site-header, .site-footer, .skip-link, .content-todo, .content-todo-block { display: none !important; }\n  body { background: #fff; color: #000; }\n}\n\n\n/* ============================================================\n   Komponenten — jede Klasse entspricht einem späteren\n   WordPress-Block (Zuordnung: wordpress-blueprint/blocks.md)\n   ============================================================ */\n\n/* ---------- Buttons ---------- */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 0.5rem;\n  min-height: var(--touch-target);\n  padding: 0.65rem 1.5rem;\n  border: 1.5px solid transparent;\n  border-radius: var(--radius-sm);\n  font-family: var(--font-text);\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n  transition:\n    background-color var(--duration-quick) var(--ease-out),\n    border-color var(--duration-quick) var(--ease-out),\n    color var(--duration-quick) var(--ease-out),\n    transform var(--duration-quick) var(--ease-out);\n}\n.btn:active { transform: translateY(1px); }\n\n.btn--primary { background: var(--color-primary); color: var(--color-text-invert); }\n.btn--primary:hover { background: var(--color-primary-dark); color: var(--color-text-invert); }\n\n.btn--accent { background: var(--color-accent-strong); color: #fff; }\n.btn--accent:hover { background: #7c3a16; color: #fff; }\n\n.btn--ghost { border-color: var(--color-border-strong); color: var(--color-text-strong); background: transparent; }\n.btn--ghost:hover { border-color: var(--color-primary); color: var(--color-primary-dark); background: var(--color-primary-light); }\n\n.section-dark .btn--ghost { border-color: rgb(247 244 236 / 0.4); color: var(--color-text-invert); }\n.section-dark .btn--ghost:hover { border-color: var(--color-text-invert); background: rgb(247 244 236 / 0.08); color: var(--color-text-invert); }\n\n.btn .btn__arrow { transition: transform var(--duration-quick) var(--ease-out); }\n.btn:hover .btn__arrow { transform: translateX(3px); }\n\n/* ---------- Header ---------- */\n\n.site-header {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  background: color-mix(in srgb, var(--color-bg-warm) 92%, transparent);\n  backdrop-filter: blur(8px);\n  border-bottom: 1px solid transparent;\n  transition: border-color var(--duration-quick) var(--ease-out),\n              box-shadow var(--duration-quick) var(--ease-out);\n}\n.site-header.is-scrolled {\n  border-bottom-color: var(--color-border);\n  box-shadow: 0 4px 20px -12px rgb(34 37 31 / 0.15);\n}\n\n.site-header__bar {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--space-5);\n  min-height: 4.5rem;\n}\n\n.brand {\n  display: inline-flex;\n  align-items: center;\n  gap: 0.65rem;\n  text-decoration: none;\n  color: var(--color-text-strong);\n}\n.brand__mark { width: 2.25rem; height: 2.25rem; flex: none; }\n.brand__name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 1.2rem;\n  line-height: 1.1;\n}\n.brand__sub {\n  display: block;\n  font-family: var(--font-text);\n  font-size: 0.7rem;\n  font-weight: 600;\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--color-text-muted);\n}\n\n.site-nav__list {\n  display: flex;\n  align-items: center;\n  gap: clamp(0.25rem, 1vw, 1rem);\n  list-style: none;\n  padding: 0;\n}\n.site-nav__link {\n  display: inline-flex;\n  align-items: center;\n  min-height: var(--touch-target);\n  padding: 0.4rem 0.75rem;\n  font-weight: 600;\n  font-size: 1rem;\n  color: var(--color-text-strong);\n  text-decoration: none;\n  border-radius: var(--radius-sm);\n}\n.site-nav__link:hover { color: var(--color-primary-dark); background: var(--color-primary-light); }\n.site-nav__link[aria-current=\"page\"] {\n  color: var(--color-primary-dark);\n  box-shadow: inset 0 -2px 0 var(--color-accent);\n  border-radius: var(--radius-sm) var(--radius-sm) 0 0;\n}\n\n.nav-toggle {\n  display: none;\n  flex-direction: column;\n  justify-content: center;\n  gap: 5px;\n  width: var(--touch-target);\n  height: var(--touch-target);\n  padding: 0.6rem;\n  border: 1.5px solid var(--color-border-strong);\n  border-radius: var(--radius-sm);\n  background: transparent;\n  cursor: pointer;\n}\n.nav-toggle__line {\n  display: block;\n  height: 2px;\n  background: var(--color-text-strong);\n  border-radius: 1px;\n  transition: transform var(--duration-quick) var(--ease-out), opacity var(--duration-quick) var(--ease-out);\n}\n\n@media (max-width: 56rem) {\n  .nav-toggle { display: flex; }\n  .site-nav {\n    position: absolute;\n    inset: 100% 0 auto 0;\n    background: var(--color-bg-warm);\n    border-bottom: 1px solid var(--color-border);\n    box-shadow: var(--shadow-lift);\n    padding: var(--space-4) var(--container-pad) var(--space-6);\n    display: none;\n  }\n  .site-nav.is-open { display: block; }\n  .site-nav__list { flex-direction: column; align- 0 -14 0 V38 Z\\\" fill=\\\"#175b4f\\\"/>\\n        <circle cx=\\\"20\\\" cy=\\\"10\\\" r=\\\"3\\\" fill=\\\"#b95c28\\\"/>\\n      </svg>\\n      <span class=\\\"brand__name\\\">Living Charity\\n        <span class=\\\"brand__sub\\\">Eingetragener Verein · Bergneustadt</span>\\n      </span>\\n    </a>\\n    <button class=\\\"nav-toggle\\\" type=\\\"button\\\" aria-expanded=\\\"false\\\" aria-controls=\\\"hauptnavigation\\\" data-nav-toggle>\\n      <span class=\\\"visually-hidden\\\">Menü öffnen oder schließen</span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n      <span class=\\\"nav-toggle__line\\\" aria-hidden=\\\"true\\\"></span>\\n    </button>\\n    <nav class=\\\"site-nav\\\" id=\\\"hauptnavigation\\\" aria-label=\\\"Hauptnavigation\\\" data-nav>\\n      <ul class=\\\"site-nav__list\\\">\\n        <li><a class=\\\"site-nav__link\\\" href=\\\"/ueber-uns/\\\">Über uns</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/projekte/\\\">Projekte</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/aktuelles/\\\">Aktuelles</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/mitmachen/\\\">Mitmachen</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/kontakt/\\\">Kontakt</a></li>\\n        <li><a class=\\\"btn btn--accent site-nav__cta\\\" href=\\\"/spenden/\\\">Jetzt helfen</a></li>\\n      </ul>\\n    </nav>\\n  </div>\\n</header>\\n\\n<main id=\\\"hauptinhalt\\\">\\n<!-- ============ Hero ============ -->\\n<section class=\\\"hero\\\">\\n  <div class=\\\"container hero__grid\\\">\\n    <div>\\n      <p class=\\\"overline\\\">Living Charity e.&nbsp;V. · seit 2010</p>\\n      <h1>Hilfe, die dort ankommt, <em>wo sie gebraucht wird.</em></h1>\\n      <p class=\\\"hero__sub\\\">\\n        Wir sind ein eingetragener Verein aus Bergneustadt und organisieren\\n        Unterstützung für Menschen in Not — persönlich, nachvollziehbar und\\n        mit direktem Draht zu den Menschen, denen geholfen wird.\\n      </p>\\n      <p class=\\\"hero__note\\\">\\n        <span class=\\\"content-todo\\\">[BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN]\\n        Konkretisierung der Unterzeile: Welche Menschen, Regionen und Situationen\\n        unterstützt der Verein laut Satzung? Erst nach Freigabe präzisieren.</span>\\n      </p>\\n      <div class=\\\"hero__actions\\\">\\n        <a class=\\\"btn btn--primary\\\" href=\\\"/projekte/\\\">Projekte ansehen <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n        <a class=\\\"btn btn--ghost\\\" href=\\\"/ueber-uns/\\\">Living Charity kennenlernen</a>\\n      </div>\\n    </div>\\n    <figure class=\\\"arch-media reveal\\\">\\n      <!-- Kontrollierte Bildfläche: KEIN Stockfoto. Anforderung siehe\\n           /content/image-requirements.md → Bild H1 (Hero). -->\\n      <svg viewBox=\\\"0 0 480 600\\\" role=\\\"img\\\" aria-label=\\\"Bildfläche für ein echtes Projektfoto von Living Charity\\\" preserveAspectRatio=\\\"xMidYMid slice\\\">\\n        <rect width=\\\"480\\\" height=\\\"600\\\" fill=\\\"#e4efe9\\\"/>\\n        <path d=\\\"M0 600 C120 470 360 520 480 400 L480 600 Z\\\" fill=\\\"#cfe2d8\\\"/>\\n        <path d=\\\"M0 600 C160 520 320 560 480 470 L480 600 Z\\\" fill=\\\"#175b4f\\\" opacity=\\\"0.12\\\"/>\\n        <circle cx=\\\"380\\\" cy=\\\"120\\\" r=\\\"46\\\" fill=\\\"#b95c28\\\" opacity=\\\"0.18\\\"/>\\n      </svg>\\n      <figcaption>Bildfläche — echtes Projektfoto erforderlich (H1, siehe Bildliste)</figcaption>\\n    </figure>\\n  </div>\\n</section>\\n\\n<!-- ============ Vertrauensleiste (nur registerkonforme Fakten) ============ -->\\n<section class=\\\"trust-bar\\\" aria-label=\\\"Fakten zum Verein\\\">\\n  <div class=\\\"container\\\">\\n    <ul class=\\\"trust-bar__list\\\">\\n      <li class=\\\"trust-bar__item\\\"><strong>Eingetragener Verein</strong><span>seit 2010</span></li>\\n      <li class=\\\"trust-bar__item\\\"><strong>Amtsgericht Köln</strong><span>VR 16395</span></li>\\n      <li class=\\\"trust-bar__item\\\"><strong>Direkt ansprechbar</strong><span><a href=\\\"mailto:info@livingcharity.de\\\">info@livingcharity.de</a></span></li>\\n      <li class=\\\"trust-bar__item\\\"><strong>Dokumentierte Projekte</strong><span>Berichte statt Behauptungen</span></li>\\n    </ul>\\n  </div>\\n</section>\\n\\n<!-- ============ Was Living Charity tut ============ -->\\n<section class=\\\"section\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Unsere Arbeit</p>\\n      <h2>Was Living Charity tut</h2>\\n      <p>Drei Aufgaben ziehen sich durch alles, was wir anpacken.\\n      <span class=\\\"content-todo\\\">[INHALT VON LIVING CHARITY ERFORDERLICH]\\n      Beschreibungen unten sind Strukturvorschläge und müssen aus den echten\\n      Vereinsinformationen (Satzungszweck) heraus formuliert werden.</span></p>\\n    </div>\\n    <div class=\\\"grid grid--cards reveal-stagger\\\">\\n      <article class=\\\"card reveal\\\">\\n        <div class=\\\"card__body\\\">\\n          <h3 class=\\\"card__title\\\">Konkrete Hilfe organisieren</h3>\\n          <p class=\\\"card__excerpt\\\">Wir setzen dort an, wo Unterstützung unmittelbar\\n          gebraucht wird — mit klar umrissenen Projekten statt vager Versprechen.\\n          <span class=\\\"content-todo\\\">konkretisieren</span></p>\\n        </div>\\n      </article>\\n      <article class=\\\"card reveal\\\">\\n        <div class=\\\"card__body\\\">\\n          <h3 class=\\\"card__title\\\">Spenden und Unterstützer mobilisieren</h3>\\n          <p class=\\\"card__excerpt\\\">Jede Spende wird einem bestätigten Zweck zugeordnet.\\n          Wer gibt, soll nachvollziehen können, was daraus wird.\\n          <span class=\\\"content-todo\\\">konkretisieren</span></p>\\n        </div>\\n      </article>\\n      <article class=\\\"card reveal\\\">\\n        <div class=\\\"card__body\\\">\\n          <h3 class=\\\"card__title\\\">Menschen und Gemeinschaften verbinden</h3>\\n          <p class=\\\"card__excerpt\\\">Hilfe lebt von Beziehungen: zwischen Unterstützern,\\n          Ehrenamtlichen und den Menschen vor Ort.\\n          <span class=\\\"content-todo\\\">konkretisieren</span></p>\\n        </div>\\n      </article>\\n    </div>\\n  </div>\\n</section>\\n\\n<!-- ============ Aktuelles Schwerpunktprojekt ============ -->\\n<section class=\\\"section section--tinted\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Im Fokus</p>\\n      <h2>Unser aktuelles Schwerpunktprojekt</h2>\\n    </div>\\n    <div class=\\\"split reveal\\\">\\n      <div class=\\\"split__media arch-media\\\" style=\\\"aspect-ratio: 4 / 3; border-radius: var(--radius-md);\\\">\\n        <svg viewBox=\\\"0 0 600 450\\\" role=\\\"img\\\" aria-label=\\\"Bildfläche für das Schwerpunktprojekt\\\" preserveAspectRatio=\\\"xMidYMid slice\\\">\\n          <rect width=\\\"600\\\" height=\\\"450\\\" fill=\\\"#e4efe9\\\"/>\\n          <path d=\\\"M0 450 C150 340 450 380 600 300 L600 450 Z\\\" fill=\\\"#cfe2d8\\\"/>\\n        </svg>\\n      </div>\\n      <div class=\\\"flow\\\">\\n        <div class=\\\"content-todo-block\\\">\\n          <strong>[INHALT VON LIVING CHARITY ERFORDERLICH] — Schwerpunktprojekt</strong>\\n          Dieser Bereich zeigt ein echtes Projekt mit: Titel, Ort, Ausgangslage,\\n          Ziel, aktuellem Stand, benötigter Unterstützung und Bildern.\\n          Die Datenstruktur ist fertig (Projekt-Vorlage) — es fehlen ausschließlich\\n          die bestätigten Projektinformationen des Vereins. Bis dahin wird diese\\n          kontrollierte Vorlage angezeigt, kein erfundener Beispielinhalt.\\n        </div>\\n        <a class=\\\"btn btn--ghost\\\" href=\\\"/projekte/projekt/\\\">Projekt-Vorlage ansehen <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<!-- ============ So wirkt Unterstützung ============ -->\\n<section class=\\\"section\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"grid grid--halves\\\">\\n      <div class=\\\"section-head reveal\\\" style=\\\"margin-bottom:0\\\">\\n        <p class=\\\"overline\\\">Transparenz</p>\\n        <h2>So wirkt Ihre Unterstützung</h2>\\n        <p>Kein Zahlenfeuerwerk — sondern ein Ablauf, den Sie nachvollziehen können.</p>\\n        <p><span class=\\\"content-todo\\\">[BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN]\\n        Dieser Ablauf ist ein Vorschlag und wird erst nach Bestätigung durch den\\n        Verein als tatsächliche Arbeitsweise dargestellt.</span></p>\\n      </div>\\n      <ol class=\\\"steps reveal\\\">\\n        <li><h3>Unterstützung geht ein</h3><p>Ihre Spende oder Ihr Hilfsangebot erreicht den Verein.</p></li>\\n        <li><h3>Zuordnung zu einem Zweck</h3><p>Wir ordnen die Unterstützung einem bestätigten Projekt oder Zweck zu.</p></li>\\n        <li><h3>Hilfe wird organisiert</h3><p>Der Verein setzt die Hilfe um oder gibt sie an verifizierte Partner weiter.</p></li>\\n        <li><h3>Fortschritt wird dokumentiert</h3><p>Was passiert, halten wir fest — mit Ort, Datum und Stand.</p></li>\\n        <li><h3>Sie sehen die Wirkung</h3><p>Unterstützer erhalten Einblick, was ihre Hilfe bewirkt hat.</p></li>\\n      </ol>\\n    </div>\\n  </div>\\n</section>\\n\\n<!-- ============ Projektübersicht (max. 3 hervorgehoben) ============ -->\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Projekte</p>\\n      <h2>Woran wir arbeiten</h2>\\n    </div>\\n    <div class=\\\"empty-state reveal\\\">\\n        <h2>Die Projektliste wird derzeit zusammengestellt</h2>\\n        <p>Wir bereiten die Darstellung unserer Projekte mit Ort, Ziel und aktuellem Stand vor.\\n        Bis dahin beantworten wir Fragen zu unserer Arbeit gern persönlich.</p>\\n        <p class=\\\"content-todo-block\\\" style=\\\"margin-top:1rem\\\"><strong>[INHALT VON LIVING CHARITY ERFORDERLICH]</strong>\\n        Echte Projekte (Titel, Ort, Ausgangslage, Ziel, Stand, Bilder mit Rechten) liefern —\\n        Struktur und Vorlage sind fertig, siehe Projekt-Detailvorlage.</p>\\n        <a class=\\\"btn btn--primary\\\" href=\\\"/kontakt/\\\">Kontakt aufnehmen <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      </div>\\n    <p style=\\\"margin-top:var(--space-6)\\\"><a class=\\\"btn btn--ghost\\\" href=\\\"/projekte/\\\">Alle Projekte ansehen <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a></p>\\n  </div>\\n</section>\\n\\n<!-- ============ Menschen hinter dem Verein ============ -->\\n<section class=\\\"section section--tinted\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Der Verein</p>\\n      <h2>Die Menschen hinter Living Charity</h2>\\n      <p>Verantwortung hat bei uns Namen und Gesichter. Der Vorstand ist Ihr\\n      direkter Ansprechpartner.</p>\\n    </div>\\n    <div class=\\\"grid grid--cards reveal-stagger\\\"><div class=\\\"team-card reveal\\\">\\n          <div class=\\\"team-card__portrait\\\" aria-hidden=\\\"true\\\">NS</div>\\n          <div>\\n            <p class=\\\"team-card__name\\\">Navaratnam Sivananthan</p>\\n            <p class=\\\"team-card__role\\\">Vorsitzender</p>\\n            <p style=\\\"margin-top:.5rem\\\"><span class=\\\"content-todo\\\">Porträt, persönlicher Satz und Freigabe fehlen [BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN]</span></p>\\n          </div>\\n        </div><div class=\\\"team-card reveal\\\">\\n          <div class=\\\"team-card__portrait\\\" aria-hidden=\\\"true\\\">OT</div>\\n          <div>\\n            <p class=\\\"team-card__name\\\">Ordin Thanapalasingham</p>\\n            <p class=\\\"team-card__role\\\">Schatzmeister</p>\\n            <p style=\\\"margin-top:.5rem\\\"><span class=\\\"content-todo\\\">Porträt, persönlicher Satz und Freigabe fehlen [BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN]</span></p>\\n          </div>\\n        </div><div class=\\\"team-card reveal\\\">\\n          <div class=\\\"team-card__portrait\\\" aria-hidden=\\\"true\\\">SS</div>\\n          <div>\\n            <p class=\\\"team-card__name\\\">Seevaratnam Sathianandan</p>\\n            <p class=\\\"team-card__role\\\">Schriftführer</p>\\n            <p style=\\\"margin-top:.5rem\\\"><span class=\\\"content-todo\\\">Porträt, persönlicher Satz und Freigabe fehlen [BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN]</span></p>\\n          </div>\\n        </div></div>\\n  </div>\\n</section>\\n\\n<!-- ============ Mitmachen ============ -->\\n<section class=\\\"section\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Mitmachen</p>\\n      <h2>Es gibt mehr als einen Weg zu helfen</h2>\\n      <p>Geld ist eine Möglichkeit — Zeit, Können und Kontakte sind genauso wertvoll.\\n      <span class=\\\"content-todo\\\">[BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN]\\n      Nur tatsächlich angebotene Unterstützungsformen bleiben aktiv.</span></p>\\n    </div>\\n    <div class=\\\"grid grid--cards reveal-stagger\\\">\\n      <article class=\\\"card reveal\\\"><div class=\\\"card__body\\\"><h3 class=\\\"card__title\\\"><a href=\\\"/spenden/\\\">Geld spenden</a></h3><p class=\\\"card__excerpt\\\">Einmalig oder regelmäßig — jede Spende wird einem bestätigten Zweck zugeordnet.</p><span class=\\\"card__link\\\">Mehr erfahren zu Spenden <span aria-hidden=\\\"true\\\">→</span></span></div></article>\\n      <article class=\\\"card reveal\\\"><div class=\\\"card__body\\\"><h3 class=\\\"card__title\\\"><a href=\\\"/mitmachen/#sachspenden\\\">Sachspenden geben</a></h3><p class=\\\"card__excerpt\\\">Manchmal hilft ein Gegenstand mehr als Geld. Wir stimmen den Bedarf vorab mit Ihnen ab.</p><span class=\\\" tbezogen: Wir freuen uns über Menschen, die\\n        anpacken — bei Aktionen vor Ort, in der Organisation oder mit besonderen\\n        Fähigkeiten (z. B. Handwerk, Sprachen, Verwaltung).</p>\\n        <p>Schreiben Sie uns kurz, was Sie einbringen möchten und wie viel Zeit\\n        Sie haben. Wir melden uns persönlich zurück.</p>\\n        <a class=\\\"btn btn--primary\\\" href=\\\"/kontakt/?anliegen=ehrenamt\\\">Ehrenamt anfragen <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      </div>\\n      <div class=\\\"info-card\\\">\\n        <h3>So läuft der Einstieg</h3>\\n        <ol style=\\\"padding-left:1.2rem; display:grid; gap:.5rem\\\">\\n          <li>Kurze Nachricht über das <a href=\\\"/kontakt/\\\">Kontaktformular</a></li>\\n          <li>Persönliches Kennenlernen (telefonisch oder vor Ort)</li>\\n          <li>Gemeinsame Auswahl einer Aufgabe, die passt</li>\\n        </ol>\\n      </div>\\n    </div>\\n\\n    <hr class=\\\"rule\\\">\\n\\n    <div class=\\\"split split--media-left reveal\\\" id=\\\"sachspenden\\\">\\n      <div class=\\\"info-card\\\">\\n        <h3>Wichtig bei Sachspenden</h3>\\n        <p>Bitte stimmen Sie Sachspenden <strong>vorab</strong> mit uns ab. So\\n        stellen wir sicher, dass die Dinge wirklich gebraucht werden und der\\n        Transport geklärt ist — nichts soll umsonst gespendet sein.</p>\\n      </div>\\n      <div class=\\\"flow\\\">\\n        <p class=\\\"overline\\\">Sachspenden</p>\\n        <h2>Dinge spenden, die gebraucht werden</h2>\\n        <p>Welche Sachspenden aktuell sinnvoll sind, hängt von den laufenden\\n        Projekten ab. Den aktuellen Bedarf nennen wir Ihnen auf Anfrage.</p>\\n        <p><span class=\\\"content-todo\\\">[INHALT VON LIVING CHARITY ERFORDERLICH]\\n        Liste typischer/aktuell benötigter Sachspenden</span></p>\\n        <a class=\\\"btn btn--primary\\\" href=\\\"/kontakt/?anliegen=sachspende\\\">Sachspende anbieten <span class=\\\"btn__arrow\\\" aria-hidden=\\ kt.</p>\\n      </div>\\n      <div class=\\\"flow reveal\\\">\\n        <p><span class=\\\"badge badge--geplant\\\">Geplant</span> — Vorbereitung läuft, Unterstützung wird gesammelt.</p>\\n        <p><span class=\\\"badge badge--aktiv\\\">Aktiv</span> — die Maßnahme wird gerade umgesetzt.</p>\\n        <p><span class=\\\"badge badge--laufend\\\">Laufende Unterstützung</span> — dauerhafte Hilfe ohne festes Enddatum.</p>\\n        <p><span class=\\\"badge badge--abgeschlossen\\\">Abgeschlossen</span> — Ziel erreicht, Abschlussbericht folgt auf der Projektseite.</p>\\n        <p><span class=\\\"badge badge--pausiert\\\">Pausiert</span> — vorübergehend angehalten, mit Begründung auf der Projektseite.</p>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section-dark cta-final\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"reveal\\\">\\n      <h2>Sie möchten ein Projekt unterstützen?</h2>\\n      <p>Allgemein oder projektbezogen — beides ist möglich.</p>\\n    </div>\\n    <div class=\\\"cta-final__actions reveal\\\">\\n      <a class=\\\"btn btn--accent\\\" href=\\\"/spenden/\\\">Jetzt unterstützen <span class=\\\"btn__arrow\\\" aria-hidden=\\\"true\\\">→</span></a>\\n      <a class=\\\"btn btn--ghost\\\" href=\\\"/kontakt/\\\">Frage stellen</a>\\n    </div>\\n  </div>\\n</section>\\n</main>\\n<footer class=\\\"site-footer\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"site-footer__grid\\\">\\n      <div class=\\\"site-footer__brand\\\">\\n        <a class=\\\"brand\\\" href=\\\"/\\\">\\n          <svg class=\\\"brand__mark\\\" viewBox=\\\"0 0 40 40\\\" aria-hidden=\\\"true\\\" focusable=\\\"false\\\">\\n            <path d=\\\"M6 38 V20 a14 14 0 0 1 28 0 V38 h-7 V21 a7 7 0 0 0 -14 0 V38 Z\\\" fill=\\\"#dfe6dc\\\"/>\\n            <circle cx=\\\"20\\\" cy=\\\"10\\\" r=\\\"3\\\" fill=\\\"#b95c28\\\"/>\\n          </svg>\\n          <span class=\\\"brand__name\\\">Living Charity\\n            <span class=\\\"bran </li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/projekte/\\\">Projekte</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/aktuelles/\\\">Aktuelles</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/mitmachen/\\\">Mitmachen</a></li>\\n<li><a class=\\\"site-nav__link\\\" href=\\\"/kontakt/\\\">Kontakt</a></li>\\n        <li><a class=\\\"btn btn--accent site-nav__cta\\\" href=\\\"/spenden/\\\">Jetzt helfen</a></li>\\n      </ul>\\n    </nav>\\n  </div>\\n</header>\\n\\n<main id=\\\"hauptinhalt\\\">\\n<div class=\\\"container\\\">\\n  <nav class=\\\"breadcrumbs\\\" aria-label=\\\"Sie sind hier\\\">\\n    <ol>\\n      <li><a href=\\\"/\\\">Startseite</a></li>\\n      <li><span aria-current=\\\"page\\\">Spenden</span></li>\\n    </ol>\\n  </nav>\\n  <header class=\\\"page-head\\\">\\n    <p class=\\\"overline\\\">Spenden &amp; Unterstützung</p>\\n    <h1>Ihre Spende, nachvollziehbar eingesetzt</h1>\\n    <p class=\\\"lead\\\">Mit Ihrer Spende ermöglichen Sie die Projekte von Living\\n    Charity e.&nbsp;V. Sie entscheiden: allgemein für die Vereinsarbeit oder\\n    gezielt für ein Projekt. Auf dieser Seite finden Sie alles, was Sie dafür\\n    brauchen — und wen Sie bei Fragen erreichen.</p>\\n    <p><span class=\\\"content-todo\\\">[INHALT VON LIVING CHARITY ERFORDERLICH]\\n    Kurzabsatz: Wofür verwendet der Verein Spenden konkret (laut Satzung)?</span></p>\\n  </header>\\n</div>\\n\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"split\\\">\\n      <!-- Spendenkomponente (DonationProvider: \\\"bank-transfer\\\") -->\\n      <div class=\\\"reveal\\\">\\n        <h2 style=\\\"margin-bottom:var(--space-5)\\\">Per Überweisung spenden</h2>\\n        <div class=\\\"donation-box\\\">\\n      <p class=\\\"donation-box__label\\\">Spendenkonto</p>\\n      <dl>\\n        <dt>Kontoinhaber</dt><dd>Living Charity e. V.</dd>\\n        <dt>Bank</dt><dd>Sparkasse Gummersbach-Bergneustadt</dd>\\n        <dt>IBAN</dt><dd><span class=\\\"iban\\\" id=\\\"iban-value\\\">DE18 3845 0000 1000 2149 63</span></dd>\\n        <dt>BIC</dt><dd>WELADED1GMB</dd>\\n        <dt>Verwendungszweck</dt><dd><span class=\\\"content-todo\\\">[INHALT VON LIVING CHARITY ERFORDERLICH] gewünschte Verwendungszwecke</span></dd>\\n      </dl>\\n      <button type=\\\"button\\\" class=\\\"btn btn--primary copy-btn\\\" data-copy-target=\\\"iban-value\\\" data-copy-plain=\\\"DE18384500001000214963\\\">\\n        IBAN kopieren\\n        <span class=\\\"copy-btn__feedback\\\" role=\\\"status\\\">Kopiert ✓</span>\\n      </button>\\n      <p style=\\\"margin-top:1rem\\\"><span class=\\\"content-todo\\\">Bankverbindung vor Livegang gegen Kontoauszug prüfen [BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN]</span></p>\\n    </div>\\n        <p class=\\\"text-sm text-muted\\\" style=\\\"margin-top:var(--space-4)\\\">\\n          Tipp: Geben Sie im Verwendungszweck Ihre Adresse an, wenn Sie eine\\n          Zuwendungsbestätigung wünschen —\\n          <span class=\\\"content-todo\\\">[BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN]\\n          ob und ab welchem Betrag Zuwendungsbestätigungen ausgestellt werden\\n          (abhängig vom Gemeinnützigkeitsstatus)</span>\\n        </p>\\n      </div>\\n      <div class=\\\"flow-lg reveal\\\">\\n        <div>\\n          <h3>Allgemein oder projektbezogen?</h3>\\n          <p><strong>Allgemeine Spende:</strong> Der Verein setzt sie dort ein, wo\\n          sie am dringendsten gebraucht wird.</p>\\n          <p><strong>Projektbezogene Spende:</strong> Nennen Sie im Verwendungszweck\\n          das Projekt — die Übersicht finden Sie unter\\n          <a href=\\\"/projekte/\\\">Projekte</a>. Kann ein Projektzweck nicht mehr\\n          erfüllt werden, informieren wir Sie über die weitere Verwendung.\\n          <span class=\\\"content-todo\\\">[BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN] Regel zur Umwidmung</span></p>\\n        </div>\\n        <div>\\n          <h3>Was mit Ihrer Spende passiert</h3>\\n          <p>Den Ablauf von Eingang bis Wirkung beschreiben wir Schritt für\\n          Schritt auf der <a href=\\\"/#hauptinhalt\\\">Startseite</a> unter\\n          „So wirkt Ihre Unterstützung\\\". Fortschritte dokumentieren wir je\\n          Projekt unter <a href=\\\"/projekte/\\\">Projekte</a> und im Bereich\\n          <a href=\\\"/aktuelles/\\\">Aktuelles</a>.</p>\\n        </div>\\n        <div>\\n          <h3>Fragen zur Spende?</h3>\\n          <p>Schreiben Sie an <a href=\\\"mailto:info@livingcharity.de\\\">info@livingcharity.de</a> —\\n          wir antworten persönlich.</p>\\n        </div>\\n      </div>\\n    </div>\\n  </div>\\n</section>\\n\\n<!-- Online-Spenden: DonationProvider-Schnittstelle (bewusst nicht aktiv) -->\\n<section class=\\\"section section--tinted section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">In Vorbereitung</p>\\n      <h2>Online spenden</h2>\\n    </div>\\n    <div class=\\\"content-todo-block reveal\\\">\\n      <strong>[BITTE DURCH DEN AUFTRAGGEBER BESTÄTIGEN] — Zahlungsanbieter</strong>\\n      Die technische Schnittstelle für einen Spendendienst (z. B. Zahlungsanbieter\\n      oder Spendenplattform) ist vorbereitet (siehe\\n      wordpress-blueprint/donation-provider.md), aber bewusst nicht aktiv:\\n      Es wird keine Zahlungsabwicklung ohne bestätigten Anbieter, Vertrag und\\n      Zugangsdaten implementiert. Bei einer externen Weiterleitung wird künftig\\n      klar erkennbar sein: zu welchem Dienst weitergeleitet wird, dass dessen\\n      Datenschutzbestimmungen gelten, ob Gebühren entstehen und wann die Spende\\n      als abgeschlossen gilt.\\n    </div>\\n  </div>\\n</section>\\n\\n<section class=\\\"section section--sm\\\">\\n  <div class=\\\"container\\\">\\n    <div class=\\\"section-head reveal\\\">\\n      <p class=\\\"overline\\\">Gut zu wissen</p>\\n      <h2>Häufige Fragen zum Spenden</h2>\\n    </div>\\n    <div class=\\\
