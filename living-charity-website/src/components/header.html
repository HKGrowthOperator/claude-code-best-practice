<div class="trust-strip">
  <strong>Eingetragener Verein seit 2010</strong> · {{site.org.register.court}} · {{site.org.register.number}}
</div>
<header class="site-header" data-header>
  <div class="container site-header__bar">
    <a class="brand" href="/" aria-label="{{site.org.name}} — zur Startseite">
      <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <!-- Nachgezeichnete Näherung der echten Bildmarke der Altseite
             (dunkelgrüner Kreis mit Wellenlinien). Original-Vektordatei und
             verbindliche Farbwerte weiterhin anfordern (LB-08). -->
        <circle cx="20" cy="20" r="17.5" fill="#10352c" stroke="#f2f4ef" stroke-width="1.2"/>
        <g clip-path="url(#lc-mark-clip)" stroke="#f2f4ef" stroke-width="2.3" fill="none" stroke-linecap="round">
          <path d="M2 12 Q 15 4 38 8"/>
          <path d="M1 19 Q 16 11 39 14"/>
          <path d="M1 26 Q 18 17 39 20"/>
          <path d="M4 32 Q 20 24 37 27"/>
        </g>
        <defs><clipPath id="lc-mark-clip"><circle cx="20" cy="20" r="16.4"/></clipPath></defs>
      </svg>
      <span class="brand__name">Living Charity
        <span class="brand__sub">Eingetragener Verein · Bergneustadt</span>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="hauptnavigation" data-nav-toggle>
      <span class="visually-hidden">Menü öffnen oder schließen</span>
      <span class="nav-toggle__line" aria-hidden="true"></span>
      <span class="nav-toggle__line" aria-hidden="true"></span>
      <span class="nav-toggle__line" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="hauptnavigation" aria-label="Hauptnavigation" data-nav>
      <ul class="site-nav__list">
        {{@nav-main}}
        <li><a class="btn site-nav__cta" href="{{site.cta.primary.href}}">{{site.cta.primary.label}}</a></li>
      </ul>
    </nav>
  </div>
</header>
